<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>املاک نعمتی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#login{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.box{background:#1a1a1a;padding:20px;border-radius:16px;width:100%;max-width:350px;border:1px solid #333}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #444;border-radius:8px;background:#111;color:#fff;font-size:14px}
button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;background:#25D366;color:#000;font-weight:bold;cursor:pointer}
#app{display:none;flex:1;flex-direction:column;height:100%}
.hdr{background:#0d4a3a;padding:12px;display:flex;justify-content:space-between;align-items:center}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.4;font-size:14px}
.m.u{align-self:flex-end;background:#0d4a3a;color:#fff;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:#2a2a2a;color:#eee;border-bottom-left-radius:4px}
.m.s{align-self:center;background:#1a2a3a;color:#88aacc;font-size:12px;padding:6px 12px;border-radius:8px}
.bar{padding:8px;background:#000;border-top:1px solid #333;display:flex;gap:8px;align-items:flex-end}
.bar textarea{flex:1;margin:0;min-height:44px;max-height:100px;resize:none}
.bar button{width:44px;height:44px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px}
#admin{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;padding:20px;overflow-y:auto}
.panel{background:#1a1a1a;border-radius:12px;padding:16px}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1;margin:0}
.card{background:#222;padding:10px;border-radius:8px;margin:8px 0;border-right:3px solid #0d4a3a}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h2 style="text-align:center;margin-bottom:16px">🏠 املاک نعمتی</h2>
    <input id="ph" placeholder="شماره موبایل" maxlength="11">
    <div style="display:flex;gap:8px">
      <input id="cd" placeholder="کد ۴ رقمی" maxlength="4" style="flex:2">
      <button onclick="getcode()" style="flex:1;margin:0">کد</button>
    </div>
    <button onclick="checkcode()">✅ ورود</button>
    <p id="st" style="color:#f66;text-align:center;margin-top:8px;font-size:13px"></p>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center">🏠</div>
      <div><div style="font-weight:bold">املاک نعمتی</div><div style="font-size:11px;opacity:.7">آنلاین</div></div>
    </div>
    <button onclick="openAdm()" style="width:auto;background:none;color:#fff;font-size:20px;padding:4px">👑</button>
  </div>
  <div class="chat" id="chat"></div>
  <div class="bar">
    <textarea id="msg" placeholder="پیام..." rows="1"></textarea>
    <button onclick="send()">➤</button>
  </div>
</div>

<div id="admin">
  <div class="panel">
    <button onclick="closeAdm()" style="background:#4a1a1a;color:#fff;width:auto;float:left">✕</button>
    <h3 style="margin-bottom:16px">📊 مدیریت</h3>
    <div class="row">
      <input id="at" placeholder="عنوان آگهی">
      <select id="aty"><option>آپارتمان</option><option>ویلا</option><option>زمین</option></select>
    </div>
    <div class="row">
      <input id="ap" placeholder="قیمت">
      <input id="ar" placeholder="منطقه">
    </div>
    <button onclick="addAd()">📢 ثبت آگهی</button>
    <p id="am" style="color:#88aacc;text-align:center;margin-top:8px"></p>
    <h4 style="margin-top:20px;color:#b0d0c0">🏷️ آگهی‌ها</h4>
    <div id="ads"></div>
  </div>
</div>

<script>
const W='https://emlak-nemati-v2.jawadmontazer313.workers.dev/api/chat';
let code='',step=0,info={};
const $=id=>document.getElementById(id);
const get=k=>JSON.parse(localStorage.getItem(k)||'[]');
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function getcode(){
  if($('ph').value.length<11){$('st').innerText='⚠️ شماره معتبر وارد کنید';return}
  code=Math.floor(1000+Math.random()*9000).toString();
  alert('کد تأیید: '+code);
  $('st').innerText='✅ ارسال شد';$('st').style.color='#25D366';
}
function checkcode(){
  if($('cd').value===code){
    $('login').style.display='none';$('app').style.display='flex';
    render();renderAds();
  }else{$('st').innerText='❌ کد اشتباه است';$('st').style.color='#f66'}
}
function render(){
  const c=$('chat');c.innerHTML='';
  const w=document.createElement('div');w.className='m b';
  w.innerHTML='👋 سلام! من دستیار هوشمند املاک نعمتی هستم.<br>برای ثبت درخواست، نام خود را بنویسید.';
  c.appendChild(w);
  get('msg').forEach(m=>{
    const d=document.createElement('div');d.className='m '+m.t;
    d.innerHTML=m.x;c.appendChild(d);
  });
  c.scrollTop=c.scrollHeight;
}
function addMsg(t,x){
  const m=get('msg');m.push({t,x,time:Date.now()});set('msg',m);render();
}
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function send(){
  const tx=$('msg').value.trim();if(!tx)return;
  $('msg').value='';addMsg('u',tx);
  
  if(step===1){info.n=tx;step=2;addMsg('b','✅ نام ثبت شد. کد ملی را وارد کنید.');return}
  if(step===2){info.i=tx;step=3;addMsg('b','✅ کد ملی ثبت شد. شماره تماس را وارد کنید.');return}
  if(step===3){
    info.p=tx;step=0;
    localStorage.setItem('info',JSON.stringify(info));
    addMsg('s','✅ اطلاعات کامل ثبت شد.');
    if(pending){const p=pending;pending=null;fetchAI(p)}
    return;
  }
  
  const l=tx.toLowerCase();
  if((l.includes('خرید')||l.includes('فروش')||l.includes('رهن')||l.includes('اجاره'))&& !localStorage.getItem('info')){
    pending=tx;step=1;addMsg('b','📋 لطفاً ابتدا <b>نام کامل</b> خود را وارد کنید.');return;
  }
  fetchAI(tx);
}
let pending='';
async function fetchAI(tx){
  addMsg('s','⏳ در حال دریافت پاسخ...');
  try{
    const r=await fetch(W,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:tx})});
    const d=await r.json();
    const m=get('msg');m.pop();set('msg',m);render();
    addMsg('b',d.answer||'پاسخی دریافت نشد.');
  }catch(e){addMsg('b','❌ خطا در ارتباط با سرور')}
}

function openAdm(){
  const p=prompt('👑 رمز مدیریت:');
  if(p==='1234'){$('admin').style.display='block';renderAds()}
  else if(p!==null)alert('❌ رمز اشتباه');
}
function closeAdm(){$('admin').style.display='none'}
function addAd(){
  const t=$('at').value, p=$('ap').value, r=$('ar').value, ty=$('aty').value;
  if(!t||!r){$('am').innerText='❌ عنوان و منطقه الزامی است';return}
  const ads=get('ads');ads.push({t,p,r,ty,date:new Date().toLocaleDateString('fa-IR')});
  set('ads',ads);
  $('at').value='';$('ap').value='';$('ar').value='';
  $('am').innerText='✅ آگهی ثبت شد';setTimeout(()=>$('am').innerText='',2000);
  renderAds();
}
function renderAds(){
  const ads=get('ads');
  $('ads').innerHTML=ads.length?ads.map((a,i)=>`<div class="card"><b>#${i+1} ${a.t}</b><br><small>${a.r} | ${a.p} | ${a.ty}</small></div>`).join(''):'<p style="color:#666;text-align:center">هیچ</p>';
}
const saved=localStorage.getItem('info');
if(saved){info=JSON.parse(saved);step=0}
</script>
</body>
</html>
