<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>داشبورد املاک نعمتی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1720; --card: #1a2433; --card2: #223046; --border: #2d3e5a;
    --text: #e6edf5; --muted: #8fa3bf; --primary: #3b82f6;
    --primary-hover: #2563eb; --danger: #ef4444; --success: #22c55e; --warn: #f59e0b;
  }
  body { font-family: Tahoma, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
  #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; }
  .login-box h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
  .login-box p { color: var(--muted); text-align: center; margin-bottom: 24px; font-size: 14px; }
  input, textarea, select { width: 100%; padding: 12px 14px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; font-family: inherit; margin-bottom: 12px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--primary); }
  button { background: var(--primary); color: #fff; border: none; padding: 12px 18px; border-radius: 10px; font-size: 15px; font-family: inherit; cursor: pointer; transition: .2s; font-weight: 600; }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.danger { background: var(--danger); padding: 6px 12px; font-size: 13px; }
  button.danger:hover { background: #dc2626; }
  button.success { background: var(--success); padding: 6px 12px; font-size: 13px; }
  button.secondary { background: var(--card2); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--border); }
  button.small { padding: 6px 12px; font-size: 13px; }
  button.link-btn { background: #1e3a5f; padding: 6px 12px; font-size: 13px; }
  button.link-btn:hover { background: #2563eb; }
  button.channel-btn { background: #9333ea; padding: 6px 12px; font-size: 13px; }
  button.channel-btn:hover { background: #7e22ce; }
  button.suggest-btn { background: #ea580c; padding: 6px 12px; font-size: 13px; }
  button.suggest-btn:hover { background: #c2410c; }
  button.edit-btn { background: #0891b2; padding: 6px 12px; font-size: 13px; }
  button.edit-btn:hover { background: #0e7490; }
  button.upload-btn { background: #16a34a; padding: 10px; font-size: 14px; }
  button.upload-btn:hover { background: #15803d; }
  button.backup-btn { background: #7c3aed; padding: 14px; font-size: 15px; }
  button.backup-btn:hover { background: #6d28d9; }
  button.excel-btn { background: #3b82f6; padding: 14px; font-size: 15px; }
  button.excel-btn:hover { background: #2563eb; }
  button.test-report-btn { background: #16a34a; padding: 14px; font-size: 15px; }
  button.test-report-btn:hover { background: #15803d; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 18px; }
  header .actions { display: flex; gap: 8px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; white-space: nowrap; font-size: 14px; color: var(--muted); transition: .2s; }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-card .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 26px; font-weight: bold; }
  .stat-card.blue .value { color: var(--primary); }
  .stat-card.green .value { color: var(--success); }
  .stat-card.warn .value { color: var(--warn); }
  .stat-card.red .value { color: var(--danger); }
  .stat-card.purple .value { color: #a78bfa; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .item.clickable { cursor: pointer; transition: .2s; }
  .item.clickable:hover { border-color: var(--primary); }
  .item.done { opacity: 0.6; }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .item-title { font-weight: bold; font-size: 15px; }
  .item-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; background: var(--card2); color: var(--muted); margin-inline-start: 6px; }
  .item-badge.pub { background: #1e3a5f; color: #60a5fa; }
  .item-badge.priv { background: #3f2e1a; color: #fbbf24; }
  .item-badge.sell { background: #14532d; color: #4ade80; }
  .item-badge.rent { background: #4a1d3f; color: #f472b6; }
  .item-badge.pending { background: #3a2a0e; color: #fbbf24; }
  .item-badge.done { background: #14532d; color: #4ade80; }
  .item-badge.cancelled { background: #3f1a1a; color: #f87171; }
  .item-row { font-size: 13px; color: var(--muted); margin: 4px 0; }
  .item-row b { color: var(--text); font-weight: normal; }
  .item-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .media-wrap { margin-top: 10px; border-radius: 10px; overflow: hidden; background: var(--card2); }
  .media-wrap img, .media-wrap video { width: 100%; max-height: 400px; object-fit: cover; display: block; cursor: pointer; }
  .media-wrap video { cursor: default; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); background: var(--card); border: 1px dashed var(--border); border-radius: 12px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--border); padding: 12px 20px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: .3s; z-index: 9999; max-width: 90vw; }
  #toast.show { opacity: 1; }
  #toast.success { border-color: var(--success); }
  #toast.error { border-color: var(--danger); }
  .loading { text-align: center; padding: 30px; color: var(--muted); }
  .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

  .stars { display: inline-flex; gap: 3px; font-size: 20px; cursor: pointer; user-select: none; }
  .stars .star { color: #4a5568; transition: .15s; }
  .stars .star.on { color: #fbbf24; }
  .stars .star:hover { transform: scale(1.15); }
  .stars.readonly { cursor: default; font-size: 16px; }
  .stars.readonly .star:hover { transform: none; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { background: #2a1f47; color: #a78bfa; padding: 3px 10px; border-radius: 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .tag .rm { cursor: pointer; opacity: 0.6; font-weight: bold; }
  .tag .rm:hover { opacity: 1; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
  .modal { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 700px; padding: 20px; margin: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 18px; }
  .modal-close { background: transparent; color: var(--muted); font-size: 24px; padding: 0 8px; }
  .modal-close:hover { color: var(--text); background: transparent; }
  .modal-section { margin-bottom: 20px; }
  .modal-section h3 { font-size: 14px; color: var(--muted); margin-bottom: 8px; font-weight: normal; }
  .contact-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .contact-item .date { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .tag-input-wrap { display: flex; gap: 6px; margin-top: 8px; }
  .tag-input-wrap input { margin-bottom: 0; }
  .tag-input-wrap button { padding: 8px 14px; }
  .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .quick-tags .qt { background: var(--card2); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; }
  .quick-tags .qt:hover { background: var(--border); color: var(--text); }

  .appt-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-inline-start: 6px; }
  .appt-type-visit { background: #1e3a5f; color: #60a5fa; }
  .appt-type-call { background: #3a2a0e; color: #fbbf24; }
  .appt-type-meeting { background: #2a1f47; color: #a78bfa; }
  .appt-upcoming { border-right: 3px solid var(--primary); }
  .appt-today { border-right: 3px solid var(--warn); background: #1f1a0e; }
  .appt-past { border-right: 3px solid var(--muted); }
  .appt-done { border-right: 3px solid var(--success); }
  .appt-cancelled { border-right: 3px solid var(--danger); }

  .channel-checkbox {
    display: flex; align-items: center; gap: 10px;
    background: #1a2c1f; border: 1px solid #2d5a3d; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 12px; cursor: pointer;
  }
  .channel-checkbox input { width: auto; margin: 0; cursor: pointer; width: 20px; height: 20px; }
  .channel-checkbox label { margin: 0; color: var(--success); font-weight: bold; cursor: pointer; font-size: 14px; }

  .action-section {
    border-radius: 14px;
    padding: 20px;
    margin-top: 16px;
  }
  .action-section .title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .action-section .desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.8;
  }
  .backup-section {
    background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(124,58,237,0.05));
    border: 1px solid rgba(124,58,237,0.4);
  }
  .backup-section .title { color: #a78bfa; }
  .test-report-section {
    background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.05));
    border: 1px solid rgba(34,197,94,0.4);
  }
  .test-report-section .title { color: #22c55e; }
  .excel-section {
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05));
    border: 1px solid rgba(59,130,246,0.4);
  }
  .excel-section .title { color: #3b82f6; }

  @media (max-width: 500px) {
    .container { padding: 12px; }
    header h1 { font-size: 16px; }
    .stat-card .value { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>🏠 داشبورد املاک</h1>
    <p>برای ورود رمز عبور را وارد کنید</p>
    <input type="password" id="loginPassword" placeholder="رمز عبور" autocomplete="current-password">
    <button onclick="doLogin()" id="loginBtn" style="width:100%">ورود</button>
  </div>
</div>

<div id="dashboard" style="display:none">
  <div class="container">
    <header>
      <h1>🏠 داشبورد املاک نعمتی</h1>
      <div class="actions">
        <button class="secondary" onclick="loadAll()">🔄 بروزرسانی</button>
        <button class="secondary" onclick="logout()">خروج</button>
      </div>
    </header>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="overview">📊 آمار</div>
      <div class="tab" data-tab="analytics">📈 تحلیل‌ها</div>
      <div class="tab" data-tab="appointments">📅 قرارها</div>
      <div class="tab" data-tab="listings">🏘️ املاک</div>
      <div class="tab" data-tab="customers">👥 مشتری‌ها</div>
      <div class="tab" data-tab="requests">📝 درخواست‌ها</div>
      <div class="tab" data-tab="fileRequests">🔍 فایل‌یابی</div>
      <div class="tab" data-tab="add">➕ افزودن ملک</div>
      <div class="tab" data-tab="broadcast">📢 پیام گروهی</div>
      <div class="tab" data-tab="settings">⚙️ تنظیمات</div>
    </div>

    <div id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
const API_BASE = "https://estate-admin-api.jawadmontazer313.workers.dev";
const PUBLIC_BASE = "https://emlak-nemati.pages.dev";
const QUICK_TAGS = ["خریدار جدی", "اجاره‌ای", "سرمایه‌گذار", "فوری", "در انتظار", "پیگیری مجدد"];

let PASSWORD = localStorage.getItem("admin_pass") || "";
let currentTab = "overview";
let customersCache = [];
let listingsCache = { public: [], private: [] };
let appointmentsCache = [];

function toast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + type;
  setTimeout(() => { t.className = ""; }, 2500);
}

async function api(path, options = {}) {
  const opts = {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + PASSWORD,
      ...(options.headers || {})
    }
  };
  const r = await fetch(API_BASE + path, opts);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error("دسترسی غیرمجاز"); }
  if (!r.ok) throw new Error(data.error || "خطا");
  return data;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function renderStars(n, editable = false) {
  n = parseInt(n) || 0;
  let html = `<div class="stars ${editable ? '' : 'readonly'}" data-rating="${n}">`;
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i <= n ? 'on' : ''}" data-val="${i}">★</span>`;
  }
  html += `</div>`;
  return html;
}

function toPersianDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString("fa-IR", { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}

function toISODateTimeLocal(dateStr) {
  if (!dateStr) return "";
  return new Date(dateStr).toISOString();
}

function fromISOToLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function doLogin() {
  const pass = document.getElementById("loginPassword").value.trim();
  if (!pass) return toast("رمز را وارد کنید", "error");
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "در حال بررسی...";
  try {
    const r = await fetch(API_BASE + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pass })
    });
    const data = await r.json();
    if (data.ok) {
      PASSWORD = pass;
      localStorage.setItem("admin_pass", pass);
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadAll();
    } else { toast("رمز اشتباه است", "error"); }
  } catch (e) { toast("خطا در ارتباط با سرور", "error"); }
  finally { btn.disabled = false; btn.textContent = "ورود"; }
}

function logout() {
  PASSWORD = "";
  localStorage.removeItem("admin_pass");
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginPassword").value = "";
}

document.getElementById("tabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  currentTab = tab.dataset.tab;
  renderTab();
});

function renderTab() {
  const c = document.getElementById("content");
  if (currentTab === "overview") renderOverview(c);
  else if (currentTab === "analytics") renderAnalytics(c);
  else if (currentTab === "appointments") renderAppointments(c);
  else if (currentTab === "listings") renderListings(c);
  else if (currentTab === "customers") renderCustomers(c);
  else if (currentTab === "requests") renderRequests(c);
  else if (currentTab === "fileRequests") renderFileRequests(c);
  else if (currentTab === "add") renderAddForm(c);
  else if (currentTab === "broadcast") renderBroadcast(c);
  else if (currentTab === "settings") renderSettings(c);
}

async function loadAll() {
  const c = document.getElementById("content");
  c.innerHTML = '<div class="loading">در حال بارگذاری...</div>';
  try { await renderTab(); }
  catch (e) { c.innerHTML = '<div class="empty">خطا: ' + escapeHtml(e.message) + '</div>'; }
}

async function renderOverview(c) {
  const { stats } = await api("/api/stats");
  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="label">املاک عمومی</div><div class="value">${stats.publicListings}</div></div>
      <div class="stat-card warn"><div class="label">املاک خصوصی</div><div class="value">${stats.privateListings}</div></div>
      <div class="stat-card green"><div class="label">مشتری‌ها</div><div class="value">${stats.customers}</div></div>
      <div class="stat-card blue"><div class="label">درخواست‌ها</div><div class="value">${stats.requests}</div></div>
      <div class="stat-card red"><div class="label">فایل‌یابی</div><div class="value">${stats.fileRequests}</div></div>
      <div class="stat-card purple"><div class="label">قرارها</div><div class="value">${stats.appointments || 0}</div></div>
    </div>
  `;
}

async function renderAnalytics(c) {
  const { analytics: a } = await api("/api/analytics");
  function bar(value, max) {
    const pct = max ? Math.round((value / max) * 100) : 0;
    return `<div style="background:var(--card2);border-radius:6px;overflow:hidden;height:22px;margin-top:4px"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);display:flex;align-items:center;justify-content:flex-end;padding-inline-end:6px;font-size:11px;color:#fff;font-weight:bold">${value}</div></div>`;
  }
  function section(title, items) {
    if (!items || !items.length) return "";
    const max = items[0][1];
    return `<div class="form-card" style="margin-bottom:16px"><div class="section-title">${title}</div>${items.map(([k, v]) => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${escapeHtml(k)}</span><span style="color:var(--muted)">${v}</span></div>${bar(v, max)}</div>`).join("")}</div>`;
  }
  let html = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="label">کل املاک</div><div class="value">${a.totalListings}</div></div>
      <div class="stat-card green"><div class="label">کل مشتری‌ها</div><div class="value">${a.totalCustomers}</div></div>
      <div class="stat-card warn"><div class="label">درخواست‌ها</div><div class="value">${a.totalRequests}</div></div>
      <div class="stat-card purple"><div class="label">قرارها</div><div class="value">${a.totalAppointments}</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card green"><div class="label">⭐ میانگین امتیاز</div><div class="value">${a.avgRating || "—"}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">از ${a.ratingCount} مشتری</div></div>
      <div class="stat-card warn"><div class="label">📅 قرارهای این ماه</div><div class="value">${a.apptsThisMonth}</div></div>
      <div class="stat-card blue"><div class="label">💰 فروش</div><div class="value">${a.listingsByType.sell}</div></div>
      <div class="stat-card red"><div class="label">🏠 اجاره</div><div class="value">${a.listingsByType.rent}</div></div>
    </div>
  `;
  html += section("🏘️ پرتکرارترین نوع ملک", a.propertyTypes);
  html += section("📍 محله‌های پرملک", a.locations);
  html += section("🎯 محله‌های پرتقاضا (درخواست‌ها)", a.reqLocations);
  html += section("🏷️ پرتکرارترین برچسب مشتری‌ها", a.tags);
  if (a.dailyListings && a.dailyListings.length) {
    const maxDaily = Math.max(...a.dailyListings.map(x => x[1]));

async function renderAppointments(c) {
  const { appointments } = await api("/api/appointments");
  appointmentsCache = appointments;
  const now = Date.now();
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
  const upcoming = appointments.filter(a => a.status === "pending" && new Date(a.date).getTime() >= now);
  const today = appointments.filter(a => a.status === "pending" && new Date(a.date).getTime() >= todayStart.getTime() && new Date(a.date).getTime() <= todayEnd.getTime());
  const past = appointments.filter(a => a.status === "pending" && new Date(a.date).getTime() < now);
  const done = appointments.filter(a => a.status === "done");
  const cancelled = appointments.filter(a => a.status === "cancelled");
  let html = `
    <div class="stats-grid">
      <div class="stat-card warn"><div class="label">امروز</div><div class="value">${today.length}</div></div>
      <div class="stat-card blue"><div class="label">پیش‌رو</div><div class="value">${upcoming.length}</div></div>
      <div class="stat-card green"><div class="label">انجام‌شده</div><div class="value">${done.length}</div></div>
      <div class="stat-card red"><div class="label">گذشته</div><div class="value">${past.length}</div></div>
    </div>
    <div style="margin-bottom:16px"><button onclick="openApptForm()" style="width:100%">➕ قرار جدید</button></div>
  `;
  if (today.length) { html += `<div class="section-title">🔥 امروز (${today.length})</div>`; html += today.map(a => apptCard(a, "today")).join(""); }
  const otherUpcoming = upcoming.filter(a => !today.includes(a));
  if (otherUpcoming.length) { html += `<div class="section-title" style="margin-top:20px">⏰ پیش‌رو (${otherUpcoming.length})</div>`; html += otherUpcoming.map(a => apptCard(a, "upcoming")).join(""); }
  if (past.length) { html += `<div class="section-title" style="margin-top:20px">⌛ گذشته (${past.length})</div>`; html += past.map(a => apptCard(a, "past")).join(""); }
  if (done.length) { html += `<div class="section-title" style="margin-top:20px">✅ انجام‌شده (${done.length})</div>`; html += done.map(a => apptCard(a, "done")).join(""); }
  if (cancelled.length) { html += `<div class="section-title" style="margin-top:20px">❌ لغو‌شده (${cancelled.length})</div>`; html += cancelled.map(a => apptCard(a, "cancelled")).join(""); }
  if (!appointments.length) html += '<div class="empty">هنوز قرار ملاقاتی ثبت نشده</div>';
  c.innerHTML = html;
}

function apptCard(a, state) {
  const typeLabels = { visit: "🏠 بازدید", call: "📞 تماس", meeting: "🤝 جلسه" };
  const typeLabel = typeLabels[a.type] || "🏠 بازدید";
  const statusLabels = { pending: "در انتظار", done: "انجام‌شده", cancelled: "لغو‌شده" };
  const statusLabel = statusLabels[a.status] || "در انتظار";
  const stateClass = a.status === "done" ? "appt-done" : (a.status === "cancelled" ? "appt-cancelled" : `appt-${state}`);
  return `
    <div class="item ${stateClass} ${a.status === 'done' || a.status === 'cancelled' ? 'done' : ''}">
      <div class="item-header"><div><span class="item-title">${escapeHtml(a.customerName || "مشتری")}</span><span class="item-badge appt-type-${a.type || 'visit'}">${typeLabel}</span><span class="item-badge ${a.status === 'done' ? 'done' : (a.status === 'cancelled' ? 'cancelled' : 'pending')}">${statusLabel}</span></div></div>
      <div class="item-row">📅 ${escapeHtml(toPersianDate(a.date))}</div>
      ${a.customerPhone ? `<div class="item-row">📞 ${escapeHtml(a.customerPhone)}</div>` : ""}
      ${a.propertyDesc ? `<div class="item-row">🏘️ ${escapeHtml(a.propertyDesc)}</div>` : ""}
      ${a.note ? `<div class="item-row">📝 ${escapeHtml(a.note)}</div>` : ""}
      ${a.reminderSent ? `<div class="item-row" style="color:var(--success)">✅ یادآور ارسال شد</div>` : ""}
      <div class="item-actions">
        ${a.status === 'pending' ? `<button class="success small" onclick="markApptDone('${escapeHtml(a._key)}')">✅ انجام شد</button><button class="secondary small" onclick="markApptCancelled('${escapeHtml(a._key)}')">❌ لغو</button>` : ""}
        <button class="secondary small" onclick="openApptEdit('${escapeHtml(a._key)}')">✏️ ویرایش</button>
        <button class="danger" onclick="deleteAppt('${escapeHtml(a._key)}')">🗑️ حذف</button>
      </div>
    </div>
  `;
}

function onCustomerPick() {
  const sel = document.getElementById("ap_customer");

  if (!opt || !opt.value) return;
  document.getElementById("ap_customerName").value = opt.dataset.name || "";
  document.getElementById("ap_customerPhone").value = opt.dataset.phone || "";
}

async function saveAppt(editKey) {
  const dateVal = document.getElementById("ap_date").value;
  if (!dateVal) return toast("تاریخ را وارد کنید", "error");
  const custSel = document.getElementById("ap_customer");
  const propSel = document.getElementById("ap_property");
  const data = {
    type: document.getElementById("ap_type").value,
    customerKey: custSel.value || "",
    customerName: document.getElementById("ap_customerName").value,
    customerPhone: document.getElementById("ap_customerPhone").value,
    propertyKey: propSel.value || "",
    propertyDesc: document.getElementById("ap_propertyDesc").value,
    date: toISODateTimeLocal(dateVal),
    duration: parseInt(document.getElementById("ap_duration").value) || 30,
    note: document.getElementById("ap_note").value
  };
  if (data.customerKey && !data.customerName) {
    const opt = custSel.options[custSel.selectedIndex];
    data.customerName = opt.dataset.name || "";
    data.customerPhone = opt.dataset.phone || "";
  }
  try {
    if (editKey) { await api("/api/appointments/" + encodeURIComponent(editKey), { method: "PUT", body: JSON.stringify(data) }); toast("ویرایش شد ✅"); }
    else { await api("/api/appointments", { method: "POST", body: JSON.stringify(data) }); toast("قرار ثبت شد ✅"); }
    closeModal();
    if (currentTab === "appointments") loadAll();
    else { document.querySelectorAll(".tab").forEach(t => t.classList.remove("active")); document.querySelector('.tab[data-tab="appointments"]').classList.add("active"); currentTab = "appointments"; renderTab(); }
  } catch (e) { toast("خطا: " + e.message, "error"); }
}

async function downloadExcel() {
  const btn = document.getElementById("excelBtn");
  const result = document.getElementById("excelResult");
  btn.disabled = true;
  btn.textContent = "⏳ در حال آماده‌سازی...";
  result.textContent = "";
  try {

      headers: { "Authorization": "Bearer " + PASSWORD }
    });
    if (!r.ok) throw new Error("خطا در دریافت فایل");
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `emlak-nemati-${dateStr}.xls`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    result.innerHTML = `✅ فایل Excel دانلود شد`;
    toast("Excel دانلود شد ✅");
  } catch (e) {
    result.innerHTML = `❌ خطا: ${escapeHtml(e.message)}`;
    toast("خطا: " + e.message, "error");

    btn.disabled = false;
    btn.textContent = "📊 دانلود فایل Excel";

}

function listingCard(item, isPublic) {
  const typeLabel = item.type === "rent" ? "اجاره" : "فروش";

  if (item.mediaFileId) {
    const mediaUrl = API_BASE + "/api/media?fileId=" + encodeURIComponent(item.mediaFileId) + "&token=" + encodeURIComponent(PASSWORD);
    if (item.mediaType === "video") mediaHtml = `<div class="media-wrap"><video src="${mediaUrl}" controls preload="metadata"></video></div>`;
    else mediaHtml = `<div class="media-wrap"><img src="${mediaUrl}" alt="ملک" loading="lazy" onclick="window.open('${mediaUrl}','_blank')"></div>`;
  }
  return `

async function uploadMedia() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*,video/*";
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const maxSize = 20 * 1024 * 1024;
    if (file.size > maxSize) { toast("حجم فایل بیشتر از ۲۰ مگابایته", "error"); return; }
    const isVideo = file.type.startsWith("video/");
    const btn = document.getElementById("uploadMediaBtn");
    const original = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = "⏳ در حال آپلود..."; }
    try {
      const r = await fetch(API_BASE + "/api/upload-media", {
        method: "POST",
        headers: { "Authorization": "Bearer " + PASSWORD, "Content-Type": file.type },
        body: file
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || "خطای آپلود");
      const mediaTypeEl = document.getElementById("e_mediaType");
      const mediaFileIdEl = document.getElementById("e_mediaFileId");
      if (mediaTypeEl) mediaTypeEl.value = data.mediaType;
      if (mediaFileIdEl) mediaFileIdEl.value = data.fileId;
      const previewBox = document.getElementById("mediaPreviewBox");
      if (previewBox) {
        const mediaUrl = API_BASE + "/api/media?fileId=" + encodeURIComponent(data.fileId) + "&token=" + encodeURIComponent(PASSWORD);
        if (data.mediaType === "video") previewBox.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">رسانه جدید:</div><div class="media-wrap"><video src="${mediaUrl}" controls preload="metadata"></video></div>`;
        else previewBox.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">رسانه جدید:</div><div class="media-wrap"><img src="${mediaUrl}" alt="پیش‌نمایش"></div>`;
      }
      toast("فایل آپلود شد ✅");
    } catch (err) { toast("خطا: " + err.message, "error"); }
    finally { if (btn) { btn.disabled = false; btn.textContent = original; } }
  };
  input.click();
}

      <div class="section-title">➕ افزودن ملک جدید</div>
      <div class="form-grid">
        <div><label>نوع</label><select id="f_type"><option value="sell">فروش</option><option value="rent">اجاره</option></select></div>
        <div><label>نمایش</label><select id="f_isPublic"><option value="true">عمومی</option><option value="false">خصوصی</option></select></div>
        <div><label>نوع ملک</label><input id="f_propertyType" placeholder="آپارتمان، ویلا..."></div>
        <div><label>متراژ</label><input id="f_size" placeholder="۱۲۰ متر"></div>
        <div><label>سند</label><input id="f_document" placeholder="تک‌برگ..."></div>
        <div><label>موقعیت</label><input id="f_location" placeholder="شهر، محله"></div>
        <div><label>قیمت</label><input id="f_price" placeholder="۵ میلیارد"></div>
        <div><label>شماره تماس</label><input id="f_phone" placeholder="۰۹..."></div>
        <div><label>نوع رسانه</label><select id="f_mediaType"><option value="">بدون</option><option value="photo">عکس</option><option value="video">ویدیو</option></select></div>
        <div><label>File ID رسانه</label><input id="f_mediaFileId" placeholder="اختیاری"></div>
        <div class="full"><label>توضیحات</label><textarea id="f_extraNotes" rows="3"></textarea></div>
        <div class="full"><button onclick="submitListing()" id="submitBtn" style="width:100%">💾 ذخیره ملک</button></div>
      </div>
    </div>
  `;
}
async function submitListing() {
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "در حال ذخیره...";
  try {
    await api("/api/listings", { method: "POST", body: JSON.stringify({
      type: document.getElementById("f_type").value,
      isPublic: document.getElementById("f_isPublic").value === "true",
      propertyType: document.getElementById("f_propertyType").value,
      size: document.getElementById("f_size").value,
      document: document.getElementById("f_document").value,
      location: document.getElementById("f_location").value,
      price: document.getElementById("f_price").value,
      phone: document.getElementById("f_phone").value,
      mediaType: document.getElementById("f_mediaType").value || null,
      mediaFileId: document.getElementById("f_mediaFileId").value || null,
      extraNotes: document.getElementById("f_extraNotes").value,
      name: "املاک نعمتی"
    }) });
    toast("ملک ذخیره شد ✅");
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelector('.tab[data-tab="listings"]').classList.add("active");
    currentTab = "listings";
    renderTab();
  } catch (e) { toast("خطا: " + e.message, "error"); btn.disabled = false; btn.textContent = "💾 ذخیره ملک"; }
}

function renderBroadcast(c) {
  c.innerHTML = `
    <div class="form-card">
      <div class="section-title">📢 ارسال پیام گروهی</div>
      <label>متن پیام</label>
      <textarea id="b_text" rows="6" placeholder="متن پیام..."></textarea>
      <button onclick="sendBroadcast()" id="bcastBtn" style="width:100%">🚀 ارسال به همه مشتری‌ها</button>
      <div id="bcastResult" style="margin-top:14px;color:var(--muted);font-size:14px"></div>
    </div>
  `;
}
async function sendBroadcast() {
  const text = document.getElementById("b_text").value.trim();
  if (!text) return toast("متن پیام خالی است", "error");
  if (!confirm("پیام به همه مشتری‌ها ارسال شود؟")) return;
  const btn = document.getElementById("bcastBtn");
  btn.disabled = true; btn.textContent = "در حال ارسال...";
  try {
    const r = await api("/api/broadcast", { method: "POST", body: JSON.stringify({ text, target: "customers" }) });
    document.getElementById("bcastResult").innerHTML = `✅ ارسال شد: <b>${r.sent}</b> | ❌ ناموفق: <b>${r.failed}</b> | 📊 کل: <b>${r.total}</b>`;
    toast("ارسال انجام شد");
  } catch (e) { toast("خطا: " + e.message, "error"); }
  finally { btn.disabled = false; btn.textContent = "🚀 ارسال به همه مشتری‌ها"; }
}

document.getElementById("loginPassword").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

(async function init() {
  if (PASSWORD) {
    try {
      const r = await fetch(API_BASE + "/api/stats", { headers: { "Authorization": "Bearer " + PASSWORD } });
      if (r.ok) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadAll();
        return;
      }
    } catch (e) {}
    logout();
  }
})();
</script>
</body>
