<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>املاک نعمتی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma;background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#login{position:fixed;inset:0;background:#000;z-index:99;display:flex;justify-content:center;align-items:center;padding:20px}
.box{background:#1a1a1a;padding:30px;border-radius:16px;width:100%;max-width:350px;border:1px solid #333;text-align:center}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #444;border-radius:8px;background:#111;color:#fff;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;background:#25D366;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
#app{display:none;flex:1;flex-direction:column;height:100%}
.hdr{background:#0d4a3a;padding:15px;display:flex;justify-content:space-between;align-items:center}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:12px 16px;border-radius:15px;line-height:1.5}
.m.u{align-self:flex-end;background:#0d4a3a;color:#fff}
.m.b{align-self:flex-start;background:#2a2a2a;color:#eee}
.m.s{align-self:center;background:#1a2a3a;color:#88aacc;font-size:12px;padding:8px 15px;border-radius:10px}
.bar{padding:10px;background:#000;border-top:1px solid #333;display:flex;gap:10px}
.bar textarea{flex:1;padding:12px;border:1px solid #444;border-radius:25px;background:#111;color:#fff;font-size:15px;resize:none;min-height:45px}
.bar button{width:50px;height:50px;margin:0;padding:0;border-radius:50%;font-size:22px}
#admin{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;padding:20px;overflow-y:auto}
.panel{background:#1a1a1a;border-radius:12px;padding:20px}
.row{display:flex;gap:10px;margin:10px 0}
.row>*{flex:1;margin:0}
.card{background:#222;padding:12px;border-radius:8px;margin:10px 0;border-right:3px solid #0d4a3a}
</style>
</head>
<body>
<div id="login">
<div class="box">
<h2 style="margin-bottom:20px">🏠 املاک نعمتی</h2>
<input id="ph" placeholder="شماره موبایل (مثال: 09121234567)" maxlength="11">
<input id="cd" placeholder="کد  رقمی (از Alert بگیرید)" maxlength="4">
<button onclick="getcode()" style="background:#2a2a2a;color:#fff">📨 دریافت کد</button>
<button onclick="checkcode()">✅ ورود به برنامه</button>
<p id="st" style="color:#f66;margin-top:15px;font-size:14px"></p>
</div>
</div>
<div id="app">
<div class="hdr">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:40px;height:40px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px"></div>
<div><div style="font-weight:bold;font-size:16px">املاک نعمتی</div><div style="font-size:12px;opacity:.7">آنلاین</div></div>
</div>
<button onclick="openAdm()" style="width:auto;background:none;color:#fff;font-size:24px;padding:5px">👑</button>
</div>
<div class="chat" id="chat"></div>
<div class="bar">
<textarea id="msg" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
<button onclick="send()">➤</button>
</div>
</div>
<div id="admin">
<div class="panel">
<button onclick="closeAdm()" style="background:#4a1a1a;color:#fff;width:auto;float:left;margin:0">✕ بستن</button>
<h3 style="margin-bottom:20px;color:#b0d0c0">📊 پنل مدیریت</h3>
<h4 style="margin-bottom:10px;color:#fff">📢 ثبت آگهی جدید</h4>
<div class="row">
<input id="at" placeholder="عنوان آگهی">
<select id="aty" style="padding:14px;border:1px solid #444;border-radius:8px;background:#111;color:#fff"><option>آپارتمان</option><option>ویلا</option><option>زمین</option><option>دفتر</option></select>
</div>
<div class="row">
<input id="ap" placeholder="قیمت (تومان)">
<input id="ar" placeholder="منطقه">
</div>
<button onclick="addAd()"> ثبت آگهی</button>
<p id="am" style="color:#88aacc;text-align:center;margin-top:15px;font-size:14px"></p>
<h4 style="margin-top:25px;margin-bottom:10px;color:#fff">🏷️ آگهی‌های ثبت شده</h4>
<div id="ads"></div>
</div>
</div>
<script>
const WORKER_URL='https://emlak-nemati-v2.jawadmontazer313.workers.dev/api/chat';
let verificationCode='';
let userStep=0;
let userInfo={};
let pendingMessage='';

function $(id){return document.getElementById(id);}
function getMessages(){return JSON.parse(localStorage.getItem('chatMessages')||'[]');}
function saveMessages(msgs){localStorage.setItem('chatMessages',JSON.stringify(msgs));}

function getcode(){
  var phone=$('ph').value.trim();
  if(phone.length<11){
    $('st').innerText='⚠️ لطفاً شماره موبایل ۱۱ رقمی وارد کنید';
    $('st').style.color='#f66';
    return;
  }
  verificationCode=Math.floor(1000+Math.random()*9000).toString();
  alert('📩 کد تأیید شما:\n\n'+verificationCode+'\n\nاین کد را در کادر پایین وارد کنید');
  $('st').innerText='✅ کد ارسال شد. کادر دوم را پر کنید.';
  $('st').style.color='#25D366';
}

function checkcode(){
  var enteredCode=$('cd').value.trim();
  if(!verificationCode){
    $('st').innerText='⚠️ ابتدا روی دکمه "دریافت کد" بزنید';
    $('st').style.color='#f66';
    return;
  }
  if(enteredCode===verificationCode){
    $('login').style.display='none';
    $('app').style.display='flex';
    renderChat();
    renderAds();
    $('msg').focus();
  }else{
    $('st').innerText='❌ کد اشتباه است. دوباره تلاش کنید';
    $('st').style.color='#f66';
  }
}

function renderChat(){
  var chatBox=$('chat');
  chatBox.innerHTML='';
  var welcome=document.createElement('div');
  welcome.className='m b';
  welcome.innerHTML='<b> سلام!</b><br>من دستیار هوشمند املاک نعمتی هستم.<br><br>📌 <b>چطور می‌توانم کمک کنم؟</b><br>• برای خرید، فروش، رهن یا اجاره پیام دهید<br>• سوالات حقوقی بپرسید<br>• یا از پنل مدیریت (👑) آگهی ثبت کنید';
  chatBox.appendChild(welcome);
  var messages=getMessages();
  messages.forEach(function(msg){
    var div=document.createElement('div');
    div.className='m '+msg.type;
    div.innerHTML=msg.text;
    chatBox.appendChild(div);
  });
  chatBox.scrollTop=chatBox.scrollHeight;
}

function addMessage(type,text){
  var msgs=getMessages();
  msgs.push({type:type,text:text,time:Date.now()});
  saveMessages(msgs);
  renderChat();
}

function send(){
  var text=$('msg').value.trim();
  if(!text)return;
  $('msg').value='';
  addMessage('user',text);
  if(userStep===1){
    userInfo.name=text;
    userStep=2;
    addMessage('bot','✅ نام شما ثبت شد.<br><br>حالا <b>کد ملی</b> یا <b>شناسه یکتا</b> خود را وارد کنید:');
    return;
  }
  if(userStep===2){
    userInfo.nationalId=text;
    userStep=3;
    addMessage('bot','✅ کد ملی ثبت شد.<br><br>حالا <b>شماره تماس</b> خود را وارد کنید:');
    return;
  }
  if(userStep===3){
    userInfo.phone=text;
    userStep=0;
    localStorage.setItem('userInfo',JSON.stringify(userInfo));
    addMessage('system','✅ اطلاعات شما با موفقیت ثبت شد.');
    if(pendingMessage){
      var msg=pendingMessage;
      pendingMessage='';
      fetchAI(msg);
    }
    return;
  }
  var lower=text.toLowerCase();
  if((lower.includes('خرید')||lower.includes('فروش')||lower.includes('رهن')||lower.includes('اجاره')) && !localStorage.getItem('userInfo')){
    pendingMessage=text;
    userStep=1;
    addMessage('bot','📋 برای ثبت درخواست، لطفاً ابتدا <b>نام کامل</b> خود را وارد کنید:');
    return;
  }
  fetchAI(text);
}

async function fetchAI(message){
  addMessage('system','⏳ در حال دریافت پاسخ...');
  try{
    var response=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:message})
    });
    var data=await response.json();
    var msgs=getMessages();
    msgs.pop();
    saveMessages(msgs);
    renderChat();
    addMessage('bot',data.answer||'پاسخی دریافت نشد.');
  }catch(error){
    var msgs=getMessages();
    msgs.pop();
    saveMessages(msgs);
    renderChat();
    addMessage('bot','❌ خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.');
  }
}

function openAdm(){
  var password=prompt('👑 رمز عبور مدیریت را وارد کنید:');
  if(password==='1234'){
    $('admin').style.display='block';
    renderAds();
  }else if(password!==null){
    alert('❌ رمز عبور اشتباه است');
  }
}

function closeAdm(){$('admin').style.display='none';}

function addAd(){
  var title=$('at').value.trim();
  var type=$('aty').value;
  var price=$('ap').value.trim();
  var region=$('ar').value.trim();
  if(!title||!region){
    $('am').innerText='❌ عنوان و منطقه الزامی است';
    $('am').style.color='#f66';
    return;
  }
  var ads=JSON.parse(localStorage.getItem('adverts')||'[]');
  ads.push({title:title,type:type,price:price||'توافقی',region:region,date:new Date().toLocaleDateString('fa-IR')});
  localStorage.setItem('adverts',JSON.stringify(ads));
  $('at').value='';
  $('ap').value='';
  $('ar').value='';
  $('am').innerText='✅ آگهی با موفقیت ثبت شد!';
  $('am').style.color='#88aacc';
  setTimeout(function(){$('am').innerText='';},3000);
  renderAds();
}

function renderAds(){
  var ads=JSON.parse(localStorage.getItem('adverts')||'[]');
  var container=$('ads');
  if(ads.length===0){
    container.innerHTML='<p style="color:#666;text-align:center;padding:20px">هیچ آگهی‌ای ثبت نشده</p>';
    return;
  }
  var html='';
  ads.forEach(function(ad,index){
    html+='<div class="card">';
    html+='<b>#'+(index+1)+' - '+ad.title+'</b><br>';
    html+='<small>📍 '+ad.region+' | 💰 '+ad.price+' | '+ad.type+'</small><br>';
    html+='<small style="color:#888">📅 '+ad.date+'</small>';
    html+='</div>';
  });
  container.innerHTML=html;
}

var savedInfo=localStorage.getItem('userInfo');
if(savedInfo){userInfo=JSON.parse(savedInfo);userStep=0;}

$('msg').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
</script>
</body>
</html>
