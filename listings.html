<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املاک نعمتی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0a0e17;
    color: #e6edf5;
    min-height: 100%;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .header { background: #1e3a5f; padding: 24px 16px 28px; }
  .header-inner { max-width: 1100px; margin: 0 auto; text-align: center; }
  .logo {
    width: 58px; height: 58px;
    background: #3b82f6;
    border-radius: 16px;
    display: inline-block;
    line-height: 58px;
    text-align: center;
    font-size: 30px;
    margin-bottom: 8px;
  }
  .brand-name { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
  .brand-tag { font-size: 13px; color: #8fa3bf; }
  .stats-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: #60a5fa;
    font-size: 13px;
    font-weight: bold;
    margin-top: 10px;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .search-wrap { margin-bottom: 16px; }
  .search-wrap input {
    width: 100%;
    padding: 15px 18px;
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 14px;
    color: #e6edf5;
    font-size: 15px;
    font-family: inherit;
    -webkit-appearance: none;
  }

  .filters-section {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .filter-row { margin-bottom: 12px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label { font-size: 12px; color: #8fa3bf; margin-bottom: 8px; font-weight: bold; }
  .filters {
    display: block;
    white-space: nowrap;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .filter {
    display: inline-block;
    padding: 8px 16px;
    background: #223046;
    border: 1px solid #2d3e5a;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: #8fa3bf;
    font-family: inherit;
    font-weight: 600;
    margin-left: 6px;
    -webkit-appearance: none;
  }
  .filter.active {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
  }

  .results-count { font-size: 13px; color: #8fa3bf; margin-bottom: 12px; }
  .results-count b { color: #e6edf5; }

  .grid { display: block; }

  .card {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .card-media {
    width: 100%;
    height: 220px;
    background: #223046;
    overflow: hidden;
    position: relative;
    text-align: center;
    cursor: pointer;
  }
  .card-media img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
  }
  .card-media .placeholder {
    font-size: 80px;
    color: #2d3e5a;
    line-height: 220px;
  }
  .card-media .type-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    background: #000;
    color: #fff;
  }
  .card-media .type-badge.sell { color: #4ade80; }
  .card-media .type-badge.rent { color: #f472b6; }

  .card-media .new-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    background: #f59e0b;
    color: #000;
  }

  .card-body { padding: 18px; }
  .card-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
  .card-price {
    font-size: 19px;
    font-weight: bold;
    color: #22c55e;
    padding: 12px 14px;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 12px;
    margin-bottom: 14px;
  }

  .card-info {
    font-size: 14px;
    color: #e6edf5;
    padding: 8px 0;
    border-bottom: 1px solid #223046;
  }
  .card-info:last-of-type { border-bottom: none; }
  .card-info .lbl {
    color: #8fa3bf;
    display: inline-block;
    min-width: 80px;
  }

  .card-notes {
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 12px;
    padding: 14px;
    margin-top: 14px;
    font-size: 14px;
    white-space: pre-wrap;
    line-height: 1.8;
    word-wrap: break-word;
    word-break: break-word;
  }
  .card-notes-title {
    color: #60a5fa;
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 13px;
  }

  .card-actions {
    padding-top: 16px;
    margin-top: 14px;
    border-top: 1px solid #2d3e5a;
    white-space: nowrap;
  }
  .card-btn {
    display: inline-block;
    width: 48%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    color: #fff;
    -webkit-appearance: none;
  }
  .card-btn-details { background: #3b82f6; margin-left: 2%; }
  .card-btn-wa { background: #25D366; }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: #8fa3bf;
    background: #1a2433;
    border: 1px dashed #2d3e5a;
    border-radius: 16px;
  }
  .empty .icon { font-size: 70px; margin-bottom: 16px; opacity: 0.5; }
  .empty h2 { font-size: 20px; margin-bottom: 8px; color: #e6edf5; }

  .loading { text-align: center; padding: 100px 20px; color: #8fa3bf; }
  .spinner {
    display: inline-block;
    width: 44px; height: 44px;
    border: 4px solid #223046;
    border-top-color: #3b82f6;
    border-radius: 50%;
    -webkit-animation: spin 0.8s linear infinite;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center;
    padding: 30px 16px;
    margin-top: 30px;
    border-top: 1px solid #2d3e5a;
    color: #8fa3bf;
    font-size: 13px;
  }
  .footer-brand { font-size: 16px; color: #e6edf5; margin-bottom: 8px; font-weight: bold; }
  .footer-info { margin: 4px 0; }
  .footer-wa {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 14px;
  }

  /* ===== صفحه تک ملک ===== */
  .single-wrap { max-width: 700px; margin: 0 auto; }
  .back-btn {
    display: inline-block;
    padding: 10px 18px;
    background: #223046;
    border: 1px solid #2d3e5a;
    border-radius: 10px;
    color: #e6edf5;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 14px;
  }
  .single-media {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .single-media img, .single-media video {
    width: 100%;
    max-height: 450px;
    object-fit: cover;
    display: block;
  }
  .single-media .placeholder {
    text-align: center;
    font-size: 90px;
    padding: 60px 20px;
    color: #2d3e5a;
  }
  .single-card {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .single-badges { margin-bottom: 14px; }
  .single-badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    margin-left: 6px;
    color: #fff;
  }
  .single-badge.sell { background: #16a34a; }
  .single-badge.rent { background: #be185d; }
  .single-badge.new { background: #f59e0b; color: #000; }

  .single-title { font-size: 26px; font-weight: bold; margin-bottom: 14px; }
  .single-price {
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 22px;
    font-weight: bold;
    color: #22c55e;
    margin-bottom: 18px;
  }
  .single-info-item {
    background: #223046;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .single-info-item .lbl {
    color: #8fa3bf;
    display: block;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .single-info-item .vlu {
    font-weight: bold;
    color: #e6edf5;
    word-wrap: break-word;
    word-break: break-word;
  }
  .single-notes {
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    font-size: 15px;
    white-space: pre-wrap;
    line-height: 1.8;
    word-wrap: break-word;
    word-break: break-word;
  }
  .single-notes-title {
    color: #60a5fa;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .single-share {
    display: block;
    width: 100%;
    padding: 14px;
    background: #223046;
    border: 1px solid #2d3e5a;
    border-radius: 12px;
    color: #e6edf5;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 14px;
    -webkit-appearance: none;
  }
  .single-fixed {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0a0e17;
    border-top: 1px solid #2d3e5a;
    padding: 12px 16px;
    z-index: 100;
  }
  .single-btn-group {
    display: block;
    max-width: 700px;
    margin: 0 auto;
    white-space: nowrap;
  }
  .single-btn {
    display: inline-block;
    width: 48%;
    padding: 15px;
    border-radius: 12px;
    text-decoration: none;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
  }
  .single-btn-call { background: #22c55e; margin-left: 2%; }
  .single-btn-wa { background: #25D366; }

  @media (max-width: 500px) {
    .container { padding: 12px; }
    .brand-name { font-size: 18px; }
    .logo { width: 50px; height: 50px; line-height: 50px; font-size: 26px; }
    .card-media { height: 190px; }
    .card-media img { height: 190px; }
    .card-media .placeholder { line-height: 190px; font-size: 70px; }
    .card-title { font-size: 18px; }
    .card-price { font-size: 17px; }
    .single-title { font-size: 20px; }
    .single-price { font-size: 18px; }
    .single-btn { padding: 13px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">🏠</div>
    <div class="brand-name">املاک نعمتی</div>
    <div class="brand-tag">خرید، فروش و اجاره ملک</div>
    <div class="stats-badge" id="totalBadge" style="display:none">در حال بارگذاری...</div>
  </div>
</div>

<div class="container">
  <div id="appContent">
    <div class="loading">
      <div class="spinner"></div>
      <div>در حال بارگذاری...</div>
    </div>
  </div>
</div>

<div id="singleFixed" style="display:none" class="single-fixed">
  <div class="single-btn-group">
    <a class="single-btn single-btn-wa" id="singleWaBtn" href="#" target="_blank">💬 واتساپ</a>
    <a class="single-btn single-btn-call" id="singleCallBtn" href="#">📞 تماس</a>
  </div>
</div>

<div class="footer" id="mainFooter">
  <div class="footer-brand">🏠 املاک نعمتی</div>
  <div class="footer-info">📍 قم، خیابان کلهری</div>
  <div class="footer-info">📞 0912 452 7903</div>
  <a class="footer-wa" id="footerWa" href="#">💬 تماس در واتساپ</a>
  <div style="margin-top:16px">© تمام حقوق محفوظ است</div>
</div>

<script>
var API_BASE = "https://estate-admin-api.jawadmontazer313.workers.dev";
var WHATSAPP_NUMBER = "989124527903";

var allListings = [];
var filterType = "all";
var filterProperty = "all";
var searchText = "";

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function(m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

function getQueryParam(name) {
  var params = window.location.search.substring(1).split("&");
  for (var i = 0; i < params.length; i++) {
    var pair = params[i].split("=");
    if (pair[0] === name) return decodeURIComponent(pair[1] || "");
  }
  return "";
}

function isNew(dateIso) {
  if (!dateIso) return false;
  var days = (Date.now() - new Date(dateIso).getTime()) / (1000*60*60*24);
  return days <= 3;
}

// ============= INIT =============
function init() {
  document.getElementById("footerWa").href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("سلام، از سایت املاک نعمتی تماس می‌گیرم.");

  var id = getQueryParam("id");
  if (id) {
    showSingleListing(id);
  } else {
    showListings();
  }
}

// ============= LIST VIEW =============
function showListings() {
  document.getElementById("totalBadge").style.display = "inline-block";
  document.getElementById("singleFixed").style.display = "none";

  var html = '<div class="search-wrap">' +
    '<input type="text" id="searchInput" placeholder="جستجو در موقعیت، نوع ملک، قیمت...">' +
    '</div>' +

    '<div class="filters-section">' +
      '<div class="filter-row">' +
        '<div class="filter-label">🏠 نوع معامله</div>' +
        '<div class="filters" id="filtersType">' +
          '<button type="button" class="filter active" data-filter-type="all">📂 همه</button>' +
          '<button type="button" class="filter" data-filter-type="sell">💰 فروش</button>' +
          '<button type="button" class="filter" data-filter-type="rent">🏠 اجاره</button>' +
        '</div>' +
      '</div>' +
      '<div class="filter-row">' +
        '<div class="filter-label">🏘️ نوع ملک</div>' +
        '<div class="filters" id="filtersProperty">' +
          '<button type="button" class="filter active" data-filter-prop="all">📂 همه</button>' +
          '<button type="button" class="filter" data-filter-prop="آپارتمان">🏢 آپارتمان</button>' +
          '<button type="button" class="filter" data-filter-prop="ویلا">🏡 ویلا</button>' +
          '<button type="button" class="filter" data-filter-prop="زمین">🌳 زمین</button>' +
          '<button type="button" class="filter" data-filter-prop="تجاری">🏪 تجاری</button>' +
          '<button type="button" class="filter" data-filter-prop="اداری">🏛️ اداری</button>' +
          '<button type="button" class="filter" data-filter-prop="مغازه">🏬 مغازه</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="results-count" id="resultsCount"></div>' +
    '<div id="listingsGrid" class="grid"></div>';

  document.getElementById("appContent").innerHTML = html;

  document.getElementById("filtersType").addEventListener("click", function(e) {
    var t = e.target || e.srcElement;
    while (t && t.className && t.className.indexOf("filter") === -1) t = t.parentNode;
    if (!t || !t.getAttribute) return;
    var all = document.querySelectorAll("#filtersType .filter");
    for (var i = 0; i < all.length; i++) all[i].className = "filter";
    t.className = "filter active";
    filterType = t.getAttribute("data-filter-type");
    renderList();
  });

  document.getElementById("filtersProperty").addEventListener("click", function(e) {
    var t = e.target || e.srcElement;
    while (t && t.className && t.className.indexOf("filter") === -1) t = t.parentNode;
    if (!t || !t.getAttribute) return;
    var all = document.querySelectorAll("#filtersProperty .filter");
    for (var i = 0; i < all.length; i++) all[i].className = "filter";
    t.className = "filter active";
    filterProperty = t.getAttribute("data-filter-prop");
    renderList();
  });

  document.getElementById("searchInput").addEventListener("input", function(e) {
    searchText = e.target.value;
    renderList();
  });

  loadListings();
}

function loadListings() {
  var grid = document.getElementById("listingsGrid");
  grid.innerHTML = '<div class="loading"><div class="spinner"></div><div>در حال بارگذاری املاک...</div></div>';

  var xhr = new XMLHttpRequest();
  xhr.open("GET", API_BASE + "/api/public/listings", true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (!data.ok) throw new Error(data.error || "خطا");
          allListings = data.listings || [];
          renderList();
        } catch (e) {
          grid.innerHTML = '<div class="empty"><div class="icon">😔</div><h2>خطا</h2><p>' + escapeHtml(e.message) + '</p></div>';
        }
      } else {
        grid.innerHTML = '<div class="empty"><div class="icon">😔</div><h2>خطا</h2><p>کد: ' + xhr.status + '</p></div>';
      }
    }
  };
  xhr.send();
}

function applyFilters() {
  var list = allListings.slice();
  if (filterType === "sell" || filterType === "rent") {
    list = list.filter(function(l) { return l.type === filterType; });
  }
  if (filterProperty !== "all") {
    list = list.filter(function(l) { return (l.propertyType || "").indexOf(filterProperty) !== -1; });
  }
  if (searchText) {
    var q = searchText.toLowerCase();
    list = list.filter(function(l) {
      return (l.location || "").toLowerCase().indexOf(q) !== -1 ||
             (l.propertyType || "").toLowerCase().indexOf(q) !== -1 ||
             (l.extra_notes || "").toLowerCase().indexOf(q) !== -1 ||
             (l.price || "").toLowerCase().indexOf(q) !== -1;
    });
  }
  return list;
}

function renderList() {
  var grid = document.getElementById("listingsGrid");
  var list = applyFilters();

  document.getElementById("totalBadge").innerHTML = '🏘️ ' + allListings.length + ' ملک موجود';
  document.getElementById("resultsCount").innerHTML = list.length === allListings.length
    ? 'نمایش <b>' + list.length + '</b> ملک'
    : 'نمایش <b>' + list.length + '</b> از <b>' + allListings.length + '</b> ملک';

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="icon">🔍</div><h2>ملکی پیدا نشد</h2><p>فیلترها رو تغییر بده</p></div>';
    return;
  }

  var html = "";
  for (var i = 0; i < list.length; i++) {
    html += cardHtml(list[i]);
  }
  grid.innerHTML = html;
}

function cardHtml(l) {
  var typeLabel = l.type === "rent" ? "🏠 اجاره" : "💰 فروش";
  var typeClass = l.type === "rent" ? "rent" : "sell";
  var isN = isNew(l.date);

  var mediaHtml = "";
  if (l.mediaFileId && l.mediaType === "photo") {
    var url = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<img src="' + url + '" alt="' + escapeHtml(l.propertyType || "ملک") + '">';
  } else if (l.mediaFileId && l.mediaType === "video") {
    var vurl = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<video src="' + vurl + '" controls preload="metadata" playsinline style="width:100%;height:220px;object-fit:cover;display:block"></video>';
  } else {
    var icons = { "آپارتمان": "🏢", "ویلا": "🏡", "ویلایی": "🏡", "زمین": "🌳", "تجاری": "🏪", "اداری": "🏛️", "مغازه": "🏬" };
    var icon = icons[l.propertyType] || "🏘️";
    mediaHtml = '<div class="placeholder">' + icon + '</div>';
  }

  var infoHtml = "";
  if (l.location) infoHtml += '<div class="card-info"><span class="lbl">📍 موقعیت:</span> ' + escapeHtml(l.location) + '</div>';
  if (l.size) infoHtml += '<div class="card-info"><span class="lbl">📐 متراژ:</span> ' + escapeHtml(l.size) + '</div>';
  if (l.document) infoHtml += '<div class="card-info"><span class="lbl">📄 سند:</span> ' + escapeHtml(l.document) + '</div>';

  var notesHtml = "";
  if (l.extra_notes) {
    notesHtml = '<div class="card-notes"><div class="card-notes-title">📝 توضیحات</div>' + escapeHtml(l.extra_notes) + '</div>';
  }

  var listingUrl = "listings.html?id=" + encodeURIComponent(l.key);
  var waMsg = "سلام، درباره این ملک سوال داشتم:\n" +
              "🏘️ " + (l.propertyType || "") + "\n" +
              "📍 " + (l.location || "") + "\n" +
              (l.price ? "💰 " + l.price + "\n" : "") +
              "\n🔗 " + "https://emlak-nemati.pages.dev/" + listingUrl;
  var waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(waMsg);

  return '<div class="card">' +
    '<div class="card-media" onclick="window.location.href=\'' + listingUrl + '\'">' +
      mediaHtml +
      '<div class="type-badge ' + typeClass + '">' + typeLabel + '</div>' +
      (isN ? '<div class="new-badge">✨ جدید</div>' : '') +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-title">' + escapeHtml(l.propertyType || "ملک") + '</div>' +
      (l.price ? '<div class="card-price">💰 ' + escapeHtml(l.price) + '</div>' : '') +
      infoHtml +
      notesHtml +
      '<div class="card-actions">' +
        '<a class="card-btn card-btn-details" href="' + listingUrl + '">👁️ جزئیات</a>' +
        '<a class="card-btn card-btn-wa" href="' + waUrl + '" target="_blank">💬 واتساپ</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ============= SINGLE VIEW =============
function showSingleListing(id) {
  document.getElementById("totalBadge").style.display = "none";
  var app = document.getElementById("appContent");
  app.innerHTML = '<div class="single-wrap">' +
    '<a class="back-btn" href="listings.html">← بازگشت به لیست</a>' +
    '<div id="singleContent">' +
      '<div class="loading"><div class="spinner"></div><div>در حال بارگذاری...</div></div>' +
    '</div>' +
  '</div>';

  var xhr = new XMLHttpRequest();
  xhr.open("GET", API_BASE + "/api/public/listing/" + encodeURIComponent(id), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (!data.ok || !data.listing) {
            document.getElementById("singleContent").innerHTML = '<div class="empty"><div class="icon">🏚️</div><h2>ملک پیدا نشد</h2></div>';
            return;
          }
          renderSingle(data.listing);
        } catch (e) {
          document.getElementById("singleContent").innerHTML = '<div class="empty"><div class="icon">🏚️</div><h2>خطا</h2><p>' + escapeHtml(e.message) + '</p></div>';
        }
      } else {
        document.getElementById("singleContent").innerHTML = '<div class="empty"><div class="icon">🏚️</div><h2>ملک پیدا نشد</h2></div>';
      }
    }
  };
  xhr.send();
}

function renderSingle(l) {
  var typeLabel = l.type === "rent" ? "🏠 اجاره" : "💰 فروش";
  var typeClass = l.type === "rent" ? "rent" : "sell";
  var isN = isNew(l.date);

  var mediaHtml = "";
  if (l.mediaFileId && l.mediaType === "photo") {
    var url = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<div class="single-media"><img src="' + url + '" alt="ملک"></div>';
  } else if (l.mediaFileId && l.mediaType === "video") {
    var vurl = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<div class="single-media"><video src="' + vurl + '" controls preload="metadata" playsinline></video></div>';
  } else {
    var icons = { "آپارتمان": "🏢", "ویلا": "🏡", "ویلایی": "🏡", "زمین": "🌳", "تجاری": "🏪", "اداری": "🏛️", "مغازه": "🏬" };
    var icon = icons[l.propertyType] || "🏘️";
    mediaHtml = '<div class="single-media"><div class="placeholder">' + icon + '</div></div>';
  }

  var infoHtml = "";
  if (l.location) infoHtml += '<div class="single-info-item"><span class="lbl">📍 موقعیت</span><span class="vlu">' + escapeHtml(l.location) + '</span></div>';
  if (l.size) infoHtml += '<div class="single-info-item"><span class="lbl">📐 متراژ</span><span class="vlu">' + escapeHtml(l.size) + '</span></div>';
  if (l.document) infoHtml += '<div class="single-info-item"><span class="lbl">📄 سند</span><span class="vlu">' + escapeHtml(l.document) + '</span></div>';

  var notesHtml = "";
  if (l.extra_notes) {
    notesHtml = '<div class="single-notes"><div class="single-notes-title">📝 توضیحات ملک</div>' + escapeHtml(l.extra_notes) + '</div>';
  }

  var html = mediaHtml +
    '<div class="single-card">' +
      '<div class="single-badges">' +
        '<span class="single-badge ' + typeClass + '">' + typeLabel + '</span>' +
        (isN ? '<span class="single-badge new">✨ جدید</span>' : '') +
      '</div>' +
      '<div class="single-title">' + escapeHtml(l.propertyType || "ملک") + '</div>' +
      (l.price ? '<div class="single-price">💰 ' + escapeHtml(l.price) + '</div>' : '') +
      infoHtml +
    '</div>' +
    notesHtml +
    '<button class="single-share" onclick="shareSingle()" type="button">📤 اشتراک‌گذاری این ملک</button>';

  document.getElementById("singleContent").innerHTML = html;

  // Footer برای صفحه تک
  var singleFooterHtml = '<div class="footer-brand">🏠 املاک نعمتی</div>' +
    '<div class="footer-info">📍 قم، خیابان کلهری</div>' +
    '<div class="footer-info">📞 0912 452 7903</div>' +
    '<div style="margin-top:16px">© تمام حقوق محفوظ است</div>';
  document.getElementById("mainFooter").innerHTML = singleFooterHtml;

  // دکمه‌های پایین
  document.getElementById("singleFixed").style.display = "block";

  if (l.phone) {
    var cleanPhone = String(l.phone).replace(/[^\d+]/g, "");
    document.getElementById("singleCallBtn").href = "tel:" + cleanPhone;
  } else {
    document.getElementById("singleCallBtn").style.display = "none";
  }

  var waMsg = "سلام، درباره این ملک سوال داشتم:\n" +
              "🏘️ " + (l.propertyType || "") + "\n" +
              "📍 " + (l.location || "") + "\n" +
              (l.price ? "💰 " + l.price + "\n" : "") +
              "\n🔗 " + window.location.href;
  document.getElementById("singleWaBtn").href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(waMsg);
}

function shareSingle() {
  var url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: "املاک نعمتی", text: "این ملک رو ببین:", url: url }).catch(function() {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function() { alert("✅ لینک کپی شد"); }).catch(function() { prompt("لینک:", url); });
  } else {
    prompt("لینک:", url);
  }
}

init();
</script>
