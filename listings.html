<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املاک نعمتی | لیست املاک</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: Tahoma, Arial, sans-serif;
    background: #0a0e17;
    color: #e6edf5;
    min-height: 100%;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .header { background: #1e3a5f; padding: 24px 16px 28px; }
  .header-inner { max-width: 1100px; margin: 0 auto; }
  .brand-row { display: block; margin-bottom: 14px; }
  .logo {
    width: 58px; height: 58px;
    background: #3b82f6;
    border-radius: 16px;
    display: inline-block;
    line-height: 58px;
    text-align: center;
    font-size: 30px;
    vertical-align: middle;
    margin-left: 12px;
  }
  .brand-info { display: inline-block; vertical-align: middle; }
  .brand-name { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
  .brand-tag { font-size: 13px; color: #8fa3bf; }
  .stats-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: #60a5fa;
    font-size: 13px;
    font-weight: bold;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .search-wrap { margin-bottom: 16px; }
  .search-wrap input {
    width: 100%;
    padding: 15px 18px;
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 14px;
    color: #e6edf5;
    font-size: 15px;
    font-family: inherit;
    -webkit-appearance: none;
  }

  .filters-section {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .filter-row { margin-bottom: 12px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label { font-size: 12px; color: #8fa3bf; margin-bottom: 8px; font-weight: bold; }
  .filters {
    display: block;
    white-space: nowrap;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .filter {
    display: inline-block;
    padding: 8px 16px;
    background: #223046;
    border: 1px solid #2d3e5a;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: #8fa3bf;
    font-family: inherit;
    font-weight: 600;
    margin-left: 6px;
    -webkit-appearance: none;
  }
  .filter.active {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
  }

  .results-count { font-size: 13px; color: #8fa3bf; margin-bottom: 12px; }
  .results-count b { color: #e6edf5; }

  .grid { display: block; }

  .card {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .card-media {
    width: 100%;
    height: 200px;
    background: #223046;
    overflow: hidden;
    position: relative;
    text-align: center;
  }
  .card-media img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
  }
  .card-media .placeholder {
    font-size: 64px;
    color: #2d3e5a;
    line-height: 200px;
  }
  .card-media .type-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    background: #000;
    color: #fff;
  }
  .card-media .type-badge.sell { color: #4ade80; }
  .card-media .type-badge.rent { color: #f472b6; }

  .card-media .new-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: bold;
    background: #f59e0b;
    color: #000;
  }

  .card-body { padding: 16px; }
  .card-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .card-price {
    font-size: 17px;
    font-weight: bold;
    color: #22c55e;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2d3e5a;
  }
  .card-info { font-size: 13px; color: #8fa3bf; margin: 5px 0; }
  .card-actions { padding-top: 12px; }
  .card-btn {
    display: inline-block;
    width: 48%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    color: #fff;
    -webkit-appearance: none;
  }
  .card-btn-details { background: #3b82f6; margin-left: 2%; }
  .card-btn-wa { background: #25D366; }

  /* ⭐ بخش جزئیات که با کلیک باز میشه - داخل خود کارت */
  .card-details {
    display: none;
    padding: 16px;
    background: #0a0e17;
    border-top: 1px solid #2d3e5a;
  }
  .card-details.show {
    display: block;
  }
  .details-title {
    font-size: 14px;
    color: #60a5fa;
    margin-bottom: 12px;
    font-weight: bold;
  }
  .details-row {
    background: #223046;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .details-row .lbl {
    color: #8fa3bf;
    font-size: 11px;
    margin-bottom: 2px;
  }
  .details-row .vlu {
    font-weight: bold;
    color: #e6edf5;
    word-wrap: break-word;
    word-break: break-word;
  }
  .details-notes {
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 10px;
    padding: 14px;
    margin-top: 12px;
    font-size: 14px;
    white-space: pre-wrap;
    line-height: 1.8;
    word-wrap: break-word;
    word-break: break-word;
  }
  .details-close {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 14px;
    background: #223046;
    border: 1px solid #2d3e5a;
    border-radius: 10px;
    color: #e6edf5;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: #8fa3bf;
    background: #1a2433;
    border: 1px dashed #2d3e5a;
    border-radius: 16px;
  }
  .empty .icon { font-size: 70px; margin-bottom: 16px; opacity: 0.5; }
  .empty h2 { font-size: 20px; margin-bottom: 8px; color: #e6edf5; }

  .loading { text-align: center; padding: 100px 20px; color: #8fa3bf; }
  .spinner {
    display: inline-block;
    width: 44px;
    height: 44px;
    border: 4px solid #223046;
    border-top-color: #3b82f6;
    border-radius: 50%;
    -webkit-animation: spin 0.8s linear infinite;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center;
    padding: 30px 16px;
    margin-top: 30px;
    border-top: 1px solid #2d3e5a;
    color: #8fa3bf;
    font-size: 13px;
  }
  .footer-brand { font-size: 16px; color: #e6edf5; margin-bottom: 8px; font-weight: bold; }
  .footer-info { margin: 4px 0; }
  .footer-wa {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 14px;
  }

  @media (max-width: 500px) {
    .container { padding: 12px; }
    .brand-name { font-size: 18px; }
    .logo { width: 50px; height: 50px; line-height: 50px; font-size: 26px; }
    .card-media { height: 180px; }
    .card-media img { height: 180px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand-row">
      <div class="logo">🏠</div>
      <div class="brand-info">
        <div class="brand-name">املاک نعمتی</div>
        <div class="brand-tag">خرید، فروش و اجاره ملک</div>
      </div>
    </div>
    <div class="stats-badge" id="totalBadge">در حال بارگذاری...</div>
  </div>
</div>

<div class="container">

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="جستجو در موقعیت، نوع ملک، قیمت...">
  </div>

  <div class="filters-section">
    <div class="filter-row">
      <div class="filter-label">🏠 نوع معامله</div>
      <div class="filters" id="filtersType">
        <button type="button" class="filter active" data-filter-type="all">📂 همه</button>
        <button type="button" class="filter" data-filter-type="sell">💰 فروش</button>
        <button type="button" class="filter" data-filter-type="rent">🏠 اجاره</button>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">🏘️ نوع ملک</div>
      <div class="filters" id="filtersProperty">
        <button type="button" class="filter active" data-filter-prop="all">📂 همه</button>
        <button type="button" class="filter" data-filter-prop="آپارتمان">🏢 آپارتمان</button>
        <button type="button" class="filter" data-filter-prop="ویلا">🏡 ویلا</button>
        <button type="button" class="filter" data-filter-prop="زمین">🌳 زمین</button>
        <button type="button" class="filter" data-filter-prop="تجاری">🏪 تجاری</button>
        <button type="button" class="filter" data-filter-prop="اداری">🏛️ اداری</button>
        <button type="button" class="filter" data-filter-prop="مغازه">🏬 مغازه</button>
      </div>
    </div>
  </div>

  <div class="results-count" id="resultsCount"></div>
  <div id="listingsGrid" class="grid"></div>

</div>

<div class="footer">
  <div class="footer-brand">🏠 املاک نعمتی</div>
  <div class="footer-info">📍 قم، خیابان کلهری</div>
  <div class="footer-info">📞 0912 452 7903</div>
  <a class="footer-wa" id="footerWa" href="#">💬 تماس در واتساپ</a>
  <div style="margin-top:16px">© تمام حقوق محفوظ است</div>
</div>

<script>
var API_BASE = "https://estate-admin-api.jawadmontazer313.workers.dev";
var WHATSAPP_NUMBER = "989124527903";

var allListings = [];
var filterType = "all";
var filterProperty = "all";
var searchText = "";

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function(m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

function isNew(dateIso) {
  if (!dateIso) return false;
  var days = (Date.now() - new Date(dateIso).getTime()) / (1000*60*60*24);
  return days <= 3;
}

function loadListings() {
  var grid = document.getElementById("listingsGrid");
  grid.innerHTML = '<div class="loading"><div class="spinner"></div><div>در حال بارگذاری املاک...</div></div>';

  var xhr = new XMLHttpRequest();
  xhr.open("GET", API_BASE + "/api/public/listings", true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (!data.ok) throw new Error(data.error || "خطا");
          allListings = data.listings || [];
          renderAll();
        } catch (e) {
          grid.innerHTML = '<div class="empty"><div class="icon">😔</div><h2>خطا</h2><p>' + escapeHtml(e.message) + '</p></div>';
        }
      } else {
        grid.innerHTML = '<div class="empty"><div class="icon">😔</div><h2>خطا در بارگذاری</h2><p>کد: ' + xhr.status + '</p></div>';
      }
    }
  };
  xhr.send();
}

function applyFilters() {
  var list = allListings.slice();
  if (filterType === "sell" || filterType === "rent") {
    list = list.filter(function(l) { return l.type === filterType; });
  }
  if (filterProperty !== "all") {
    list = list.filter(function(l) { return (l.propertyType || "").indexOf(filterProperty) !== -1; });
  }
  if (searchText) {
    var q = searchText.toLowerCase();
    list = list.filter(function(l) {
      return (l.location || "").toLowerCase().indexOf(q) !== -1 ||
             (l.propertyType || "").toLowerCase().indexOf(q) !== -1 ||
             (l.extra_notes || "").toLowerCase().indexOf(q) !== -1 ||
             (l.price || "").toLowerCase().indexOf(q) !== -1;
    });
  }
  return list;
}

function renderAll() {
  var grid = document.getElementById("listingsGrid");
  var list = applyFilters();

  document.getElementById("totalBadge").innerHTML = '🏘️ ' + allListings.length + ' ملک موجود';
  document.getElementById("resultsCount").innerHTML = list.length === allListings.length
    ? 'نمایش <b>' + list.length + '</b> ملک'
    : 'نمایش <b>' + list.length + '</b> از <b>' + allListings.length + '</b> ملک';

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="icon">🔍</div><h2>ملکی پیدا نشد</h2><p>فیلترها رو تغییر بده</p></div>';
    return;
  }

  var html = "";
  for (var i = 0; i < list.length; i++) {
    html += cardHtml(list[i], i);
  }
  grid.innerHTML = html;
}

function cardHtml(l, idx) {
  var typeLabel = l.type === "rent" ? "🏠 اجاره" : "💰 فروش";
  var typeClass = l.type === "rent" ? "rent" : "sell";
  var isN = isNew(l.date);
  var cardId = "card_" + idx;
  var detailsId = "details_" + idx;

  var mediaHtml = "";
  if (l.mediaFileId && l.mediaType === "photo") {
    var url = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<img src="' + url + '" alt="' + escapeHtml(l.propertyType || "ملک") + '">';
  } else if (l.mediaFileId && l.mediaType === "video") {
    mediaHtml = '<div class="placeholder">🎬</div>';
  } else {
    var icons = { "آپارتمان": "🏢", "ویلا": "🏡", "ویلایی": "🏡", "زمین": "🌳", "تجاری": "🏪", "اداری": "🏛️", "مغازه": "🏬" };
    var icon = icons[l.propertyType] || "🏘️";
    mediaHtml = '<div class="placeholder">' + icon + '</div>';
  }

  var infoRows = "";
  if (l.location) infoRows += '<div class="card-info">📍 ' + escapeHtml(l.location) + '</div>';
  if (l.size) infoRows += '<div class="card-info">📐 ' + escapeHtml(l.size) + (l.size.indexOf("متر") !== -1 ? "" : " متر") + '</div>';
  if (l.document) infoRows += '<div class="card-info">📄 سند: ' + escapeHtml(l.document) + '</div>';

  var waMsg = "سلام، درباره این ملک سوال داشتم:\n" + (l.propertyType || "") + " - " + (l.location || "");
  var waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(waMsg);

  // Details content
  var detailsHtml = '<div class="details-title">📋 جزئیات کامل ملک</div>';
  if (l.location) detailsHtml += '<div class="details-row"><div class="lbl">📍 موقعیت</div><div class="vlu">' + escapeHtml(l.location) + '</div></div>';
  if (l.size) detailsHtml += '<div class="details-row"><div class="lbl">📐 متراژ</div><div class="vlu">' + escapeHtml(l.size) + '</div></div>';
  if (l.document) detailsHtml += '<div class="details-row"><div class="lbl">📄 سند</div><div class="vlu">' + escapeHtml(l.document) + '</div></div>';
  if (l.price) detailsHtml += '<div class="details-row"><div class="lbl">💰 قیمت</div><div class="vlu" style="color:#22c55e">' + escapeHtml(l.price) + '</div></div>';
  if (l.extra_notes) detailsHtml += '<div class="details-notes">📝 ' + escapeHtml(l.extra_notes) + '</div>';
  detailsHtml += '<a href="' + waUrl + '" target="_blank" class="details-close" style="background:#25D366;border-color:#25D366;color:#fff;text-decoration:none;display:block;text-align:center">💬 تماس در واتساپ</a>';
  detailsHtml += '<button type="button" class="details-close" onclick="toggleDetails(\'' + detailsId + '\')">❌ بستن</button>';

  return '<div class="card" id="' + cardId + '">' +
    '<div class="card-media">' +
      mediaHtml +
      '<div class="type-badge ' + typeClass + '">' + typeLabel + '</div>' +
      (isN ? '<div class="new-badge">✨ جدید</div>' : '') +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-title">' + escapeHtml(l.propertyType || "ملک") + '</div>' +
      (l.price ? '<div class="card-price">' + escapeHtml(l.price) + '</div>' : '') +
      infoRows +
      '<div class="card-actions">' +
        '<button type="button" class="card-btn card-btn-details" onclick="toggleDetails(\'' + detailsId + '\')">👁️ جزئیات</button>' +
        '<a class="card-btn card-btn-wa" href="' + waUrl + '" target="_blank">💬 واتساپ</a>' +
      '</div>' +
    '</div>' +
    '<div class="card-details" id="' + detailsId + '">' + detailsHtml + '</div>' +
  '</div>';
}

function toggleDetails(id) {
  var el = document.getElementById(id);
  if (!el) return;
  if (el.className.indexOf("show") !== -1) {
    el.className = "card-details";
  } else {
    el.className = "card-details show";
  }
}

document.getElementById("filtersType").addEventListener("click", function(e) {
  var t = e.target || e.srcElement;
  while (t && t.className && t.className.indexOf("filter") === -1) t = t.parentNode;
  if (!t || !t.getAttribute) return;
  var all = document.querySelectorAll("#filtersType .filter");
  for (var i = 0; i < all.length; i++) all[i].className = "filter";
  t.className = "filter active";
  filterType = t.getAttribute("data-filter-type");
  renderAll();
});

document.getElementById("filtersProperty").addEventListener("click", function(e) {
  var t = e.target || e.srcElement;
  while (t && t.className && t.className.indexOf("filter") === -1) t = t.parentNode;
  if (!t || !t.getAttribute) return;
  var all = document.querySelectorAll("#filtersProperty .filter");
  for (var i = 0; i < all.length; i++) all[i].className = "filter";
  t.className = "filter active";
  filterProperty = t.getAttribute("data-filter-prop");
  renderAll();
});

document.getElementById("searchInput").addEventListener("input", function(e) {
  searchText = e.target.value;
  renderAll();
});

document.getElementById("footerWa").href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("سلام، از سایت املاک نعمتی تماس می‌گیرم.");

loadListings();
</script>
</body>
</html>
