<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املاک نعمتی | لیست املاک</title>
<meta name="description" content="مشاهده همه املاک موجود برای خرید و اجاره - املاک نعمتی">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: #0a0e17;
    color: #e6edf5;
    min-height: 100vh;
    line-height: 1.7;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  .header {
    background: linear-gradient(135deg, #1e3a5f 0%, #0a0e17 100%);
    padding: 24px 16px 28px;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .logo {
    width: 58px; height: 58px;
    background: #3b82f6;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
  }
  .brand-info { flex: 1; }
  .brand-name { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
  .brand-tag { font-size: 13px; color: #8fa3bf; }
  .stats-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: #60a5fa;
    font-size: 13px;
    font-weight: bold;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap input {
    width: 100%;
    padding: 15px 48px 15px 18px;
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 14px;
    color: #e6edf5;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-wrap input:focus { border-color: #3b82f6; }
  .search-wrap .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    margin-top: -10px;
    color: #8fa3bf;
    font-size: 20px;
    pointer-events: none;
  }

  .filters-section {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .filter-row { margin-bottom: 12px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label { font-size: 12px; color: #8fa3bf; margin-bottom: 8px; font-weight: bold; }
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter {
    padding: 8px 16px;
    background: #223046;
    border: 1px solid #2d3e5a;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 13px;
    color: #8fa3bf;
    font-family: inherit;
    font-weight: 600;
    -webkit-appearance: none;
    appearance: none;
  }
  .filter.active {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
  }

  .results-count { font-size: 13px; color: #8fa3bf; margin-bottom: 12px; padding: 0 4px; }
  .results-count b { color: #e6edf5; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: #1a2433;
    border: 1px solid #2d3e5a;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card-media {
    width: 100%;
    height: 200px;
    background: #223046;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-media .placeholder {
    font-size: 64px;
    color: #2d3e5a;
  }
  .card-media .type-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    background: rgba(0,0,0,0.75);
    color: #fff;
  }
  .card-media .type-badge.sell { color: #4ade80; }
  .card-media .type-badge.rent { color: #f472b6; }

  .card-media .new-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: bold;
    background: #f59e0b;
    color: #000;
  }

  .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
  .card-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .card-price {
    font-size: 17px;
    font-weight: bold;
    color: #22c55e;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2d3e5a;
  }
  .card-info {
    font-size: 13px;
    color: #8fa3bf;
    margin: 5px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-actions {
    margin-top: auto;
    padding-top: 12px;
    display: flex;
    gap: 8px;
  }
  .card-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    -webkit-appearance: none;
    appearance: none;
  }
  .card-btn-details { background: #3b82f6; color: #fff; }
  .card-btn-wa { background: #25D366; color: #fff; }

  /* ⭐ MODAL - سازگار با WebView قدیمی */
  .modal-bg {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 99999;
    display: none;
    padding: 12px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-bg.show {
    display: block;
  }
  .modal-box {
    background: #0a0e17;
    border: 1px solid #2d3e5a;
    border-radius: 20px;
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    overflow: hidden;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.85);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .modal-media {
    width: 100%;
    min-height: 150px;
    max-height: 400px;
    background: #223046;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .modal-media img {
    width: 100%;
    height: auto;
    max-height: 400px;
    object-fit: cover;
    display: block;
  }
  .modal-media video {
    width: 100%;
    max-height: 400px;
    display: block;
  }
  .modal-media .placeholder {
    font-size: 90px;
    padding: 60px 0;
    opacity: 0.5;
  }
  .modal-content { padding: 22px; }
  .modal-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .modal-badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
  }
  .modal-badge.sell { background: #16a34a; }
  .modal-badge.rent { background: #be185d; }
  .modal-badge.new { background: #f59e0b; color: #000; }

  .modal-title { font-size: 24px; font-weight: bold; margin-bottom: 14px; }
  .modal-price {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 14px;
    margin-bottom: 18px;
  }
  .modal-price .icon { font-size: 26px; }
  .modal-price .val { font-size: 22px; font-weight: bold; color: #22c55e; }

  .modal-info-grid {
    display: block;
    margin-bottom: 18px;
  }
  .modal-info-item {
    background: #223046;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
  }
  .modal-info-item:last-child { margin-bottom: 0; }
  .modal-info-item .ic { font-size: 22px; flex-shrink: 0; }
  .modal-info-item .body { flex: 1; min-width: 0; }
  .modal-info-item .lbl { font-size: 11px; color: #8fa3bf; margin-bottom: 2px; }
  .modal-info-item .vlu { font-size: 14px; font-weight: bold; word-wrap: break-word; word-break: break-word; }

  .modal-notes {
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .modal-notes-title { font-size: 13px; color: #60a5fa; margin-bottom: 8px; font-weight: bold; }
  .modal-notes-text { font-size: 14px; white-space: pre-wrap; line-height: 1.8; word-wrap: break-word; word-break: break-word; }

  .modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .modal-btn {
    flex: 1;
    min-width: 120px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #fff;
    -webkit-appearance: none;
    appearance: none;
  }
  .modal-btn-wa { background: #25D366; }
  .modal-btn-call { background: #22c55e; }
  .modal-btn-share { background: #223046; border: 1px solid #2d3e5a; color: #e6edf5; }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: #8fa3bf;
    background: #1a2433;
    border: 1px dashed #2d3e5a;
    border-radius: 16px;
  }
  .empty .icon { font-size: 70px; margin-bottom: 16px; opacity: 0.5; }
  .empty h2 { font-size: 20px; margin-bottom: 8px; color: #e6edf5; }

  .loading {
    text-align: center;
    padding: 100px 20px;
    color: #8fa3bf;
  }
  .spinner {
    display: inline-block;
    width: 44px;
    height: 44px;
    border: 4px solid #223046;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    -webkit-animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  .footer {
    text-align: center;
    padding: 30px 16px;
    margin-top: 30px;
    border-top: 1px solid #2d3e5a;
    color: #8fa3bf;
    font-size: 13px;
  }
  .footer-brand { font-size: 16px; color: #e6edf5; margin-bottom: 8px; font-weight: bold; }
  .footer-info { margin: 4px 0; }
  .footer-wa {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 10px 20px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 14px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }

  @media (max-width: 500px) {
    .container { padding: 12px; }
    .brand-name { font-size: 18px; }
    .logo { width: 50px; height: 50px; font-size: 26px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .modal-title { font-size: 20px; }
    .modal-price .val { font-size: 18px; }
    .modal-btn { min-width: 100px; padding: 13px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand-row">
      <div class="logo">🏠</div>
      <div class="brand-info">
        <div class="brand-name">املاک نعمتی</div>
        <div class="brand-tag">خرید، فروش و اجاره ملک</div>
      </div>
    </div>
    <div class="stats-badge" id="totalBadge">
      <span>⏳</span>
      <span>در حال بارگذاری...</span>
    </div>
  </div>
</div>

<div class="container">

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="جستجو در موقعیت، نوع ملک، قیمت...">
    <span class="icon">🔍</span>
  </div>

  <div class="filters-section">
    <div class="filter-row">
      <div class="filter-label">🏠 نوع معامله</div>
      <div class="filters" id="filtersType">
        <button class="filter active" data-filter-type="all">📂 همه</button>
        <button class="filter" data-filter-type="sell">💰 فروش</button>
        <button class="filter" data-filter-type="rent">🏠 اجاره</button>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">🏘️ نوع ملک</div>
      <div class="filters" id="filtersProperty">
        <button class="filter active" data-filter-prop="all">📂 همه</button>
        <button class="filter" data-filter-prop="آپارتمان">🏢 آپارتمان</button>
        <button class="filter" data-filter-prop="ویلا">🏡 ویلا</button>
        <button class="filter" data-filter-prop="زمین">🌳 زمین</button>
        <button class="filter" data-filter-prop="تجاری">🏪 تجاری</button>
        <button class="filter" data-filter-prop="اداری">🏛️ اداری</button>
        <button class="filter" data-filter-prop="مغازه">🏬 مغازه</button>
      </div>
    </div>
  </div>

  <div class="results-count" id="resultsCount"></div>
  <div id="listingsGrid" class="grid"></div>

</div>

<div class="footer">
  <div class="footer-brand">🏠 املاک نعمتی</div>
  <div class="footer-info">📍 قم، خیابان کلهری</div>
  <div class="footer-info">📞 0912 452 7903</div>
  <a class="footer-wa" id="footerWa" href="#" target="_blank">
    <span>💬</span>
    <span>تماس در واتساپ</span>
  </a>
  <div style="margin-top:16px">© تمام حقوق محفوظ است</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()" type="button">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
var API_BASE = "https://estate-admin-api.jawadmontazer313.workers.dev";
var WHATSAPP_NUMBER = "989124527903";

var allListings = [];
var filterType = "all";
var filterProperty = "all";
var searchText = "";

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function(m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

function isNew(dateIso) {
  if (!dateIso) return false;
  var days = (Date.now() - new Date(dateIso).getTime()) / (1000*60*60*24);
  return days <= 3;
}

function loadListings() {
  var grid = document.getElementById("listingsGrid");
  grid.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div><div>در حال بارگذاری املاک...</div></div>';

  var xhr = new XMLHttpRequest();
  xhr.open("GET", API_BASE + "/api/public/listings", true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (!data.ok) throw new Error(data.error || "خطا");
          allListings = data.listings || [];
          renderAll();
        } catch (e) {
          grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="icon">😔</div><h2>خطا در بارگذاری</h2><p>' + escapeHtml(e.message) + '</p></div>';
          document.getElementById("totalBadge").innerHTML = '<span>❌</span><span>خطا</span>';
        }
      } else {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="icon">😔</div><h2>خطا در بارگذاری</h2><p>کد خطا: ' + xhr.status + '</p></div>';
      }
    }
  };
  xhr.send();
}

function applyFilters() {
  var list = allListings.slice();

  if (filterType === "sell" || filterType === "rent") {
    list = list.filter(function(l) { return l.type === filterType; });
  }

  if (filterProperty !== "all") {
    list = list.filter(function(l) { return (l.propertyType || "").indexOf(filterProperty) !== -1; });
  }

  if (searchText) {
    var q = searchText.toLowerCase();
    list = list.filter(function(l) {
      return (l.location || "").toLowerCase().indexOf(q) !== -1 ||
             (l.propertyType || "").toLowerCase().indexOf(q) !== -1 ||
             (l.extra_notes || "").toLowerCase().indexOf(q) !== -1 ||
             (l.price || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  return list;
}

function renderAll() {
  var grid = document.getElementById("listingsGrid");
  var list = applyFilters();

  document.getElementById("totalBadge").innerHTML = '<span>🏘️</span><span>' + allListings.length + ' ملک موجود</span>';
  document.getElementById("resultsCount").innerHTML = list.length === allListings.length
    ? 'نمایش <b>' + list.length + '</b> ملک'
    : 'نمایش <b>' + list.length + '</b> از <b>' + allListings.length + '</b> ملک';

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="icon">🔍</div><h2>ملکی پیدا نشد</h2><p>فیلترها یا جستجو رو تغییر بده</p></div>';
    return;
  }

  var html = "";
  for (var i = 0; i < list.length; i++) {
    html += cardHtml(list[i]);
  }
  grid.innerHTML = html;
}

function cardHtml(l) {
  var typeLabel = l.type === "rent" ? "🏠 اجاره" : "💰 فروش";
  var typeClass = l.type === "rent" ? "rent" : "sell";
  var isN = isNew(l.date);

  var mediaHtml = "";
  if (l.mediaFileId && l.mediaType === "photo") {
    var url = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<img src="' + url + '" alt="' + escapeHtml(l.propertyType || "ملک") + '" loading="lazy">';
  } else if (l.mediaFileId && l.mediaType === "video") {
    mediaHtml = '<div class="placeholder">🎬</div>';
  } else {
    var icons = { "آپارتمان": "🏢", "ویلا": "🏡", "ویلایی": "🏡", "زمین": "🌳", "تجاری": "🏪", "اداری": "🏛️", "مغازه": "🏬" };
    var icon = icons[l.propertyType] || "🏘️";
    mediaHtml = '<div class="placeholder">' + icon + '</div>';
  }

  var infoRows = [];
  if (l.location) infoRows.push('<div class="card-info"><span>📍</span><span>' + escapeHtml(l.location) + '</span></div>');
  if (l.size) infoRows.push('<div class="card-info"><span>📐</span><span>' + escapeHtml(l.size) + (l.size.indexOf("متر") !== -1 ? "" : " متر") + '</span></div>');
  if (l.document) infoRows.push('<div class="card-info"><span>📄</span><span>سند: ' + escapeHtml(l.document) + '</span></div>');

  var waMsg = "سلام، درباره این ملک سوال داشتم:\n" + (l.propertyType || "") + " - " + (l.location || "");
  var waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(waMsg);

  return '<div class="card">' +
    '<div class="card-media" onclick="openModal(\'' + escapeHtml(l.key) + '\')">' +
      mediaHtml +
      '<div class="type-badge ' + typeClass + '">' + typeLabel + '</div>' +
      (isN ? '<div class="new-badge">✨ جدید</div>' : '') +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-title">' + escapeHtml(l.propertyType || "ملک") + '</div>' +
      (l.price ? '<div class="card-price">' + escapeHtml(l.price) + '</div>' : '') +
      infoRows.join("") +
      '<div class="card-actions">' +
        '<button type="button" class="card-btn card-btn-details" onclick="openModal(\'' + escapeHtml(l.key) + '\')">👁️ جزئیات</button>' +
        '<a class="card-btn card-btn-wa" href="' + waUrl + '" target="_blank">💬 واتساپ</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function openModal(key) {
  var l = null;
  for (var i = 0; i < allListings.length; i++) {
    if (allListings[i].key === key) { l = allListings[i]; break; }
  }
  if (!l) return;

  var typeLabel = l.type === "rent" ? "🏠 اجاره" : "💰 فروش";
  var typeClass = l.type === "rent" ? "rent" : "sell";
  var isN = isNew(l.date);

  var mediaHtml = "";
  if (l.mediaFileId && l.mediaType === "photo") {
    var url = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<img src="' + url + '" alt="' + escapeHtml(l.propertyType || "ملک") + '">';
  } else if (l.mediaFileId && l.mediaType === "video") {
    var vurl = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = '<video src="' + vurl + '" controls preload="metadata" playsinline></video>';
  } else {
    var icons = { "آپارتمان": "🏢", "ویلا": "🏡", "ویلایی": "🏡", "زمین": "🌳", "تجاری": "🏪", "اداری": "🏛️", "مغازه": "🏬" };
    var icon = icons[l.propertyType] || "🏘️";
    mediaHtml = '<div class="placeholder">' + icon + '</div>';
  }

  var infoHtml = "";
  if (l.size || l.document || l.location) {
    infoHtml = '<div class="modal-info-grid">';
    if (l.size) infoHtml += '<div class="modal-info-item"><div class="ic">📐</div><div class="body"><div class="lbl">متراژ</div><div class="vlu">' + escapeHtml(l.size) + '</div></div></div>';
    if (l.document) infoHtml += '<div class="modal-info-item"><div class="ic">📄</div><div class="body"><div class="lbl">سند</div><div class="vlu">' + escapeHtml(l.document) + '</div></div></div>';
    if (l.location) infoHtml += '<div class="modal-info-item"><div class="ic">📍</div><div class="body"><div class="lbl">موقعیت</div><div class="vlu">' + escapeHtml(l.location) + '</div></div></div>';
    infoHtml += '</div>';
  }

  var notesHtml = "";
  if (l.extra_notes) {
    notesHtml = '<div class="modal-notes"><div class="modal-notes-title">📝 توضیحات ملک</div><div class="modal-notes-text">' + escapeHtml(l.extra_notes) + '</div></div>';
  }

  var waMsg = "سلام، درباره این ملک سوال داشتم:\n" + (l.propertyType || "") + " - " + (l.location || "");
  var waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(waMsg);

  var html = '<div class="modal-media">' + mediaHtml + '</div>' +
    '<div class="modal-content">' +
      '<div class="modal-badges">' +
        '<span class="modal-badge ' + typeClass + '">' + typeLabel + '</span>' +
        (isN ? '<span class="modal-badge new">✨ جدید</span>' : '') +
      '</div>' +
      '<div class="modal-title">' + escapeHtml(l.propertyType || "ملک") + '</div>' +
      (l.price ? '<div class="modal-price"><span class="icon">💰</span><span class="val">' + escapeHtml(l.price) + '</span></div>' : '') +
      infoHtml +
      notesHtml +
      '<div class="modal-actions">' +
        '<a class="modal-btn modal-btn-wa" href="' + waUrl + '" target="_blank">💬 واتساپ</a>' +
        '<button type="button" class="modal-btn modal-btn-share" onclick="shareListing(\'' + escapeHtml(l.key) + '\')">📤 اشتراک‌گذاری</button>' +
      '</div>' +
    '</div>';

  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modalBg").className = "modal-bg show";
}

function closeModal() {
  document.getElementById("modalBg").className = "modal-bg";
  document.getElementById("modalContent").innerHTML = "";
}

function shareListing(key) {
  var url = "https://emlak-nemati.pages.dev/p.html?id=" + encodeURIComponent(key);
  if (navigator.share) {
    navigator.share({ title: "املاک نعمتی", text: "این ملک رو ببین:", url: url }).catch(function() {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function() {
      alert("✅ لینک کپی شد");
    }).catch(function() {
      prompt("لینک رو کپی کن:", url);
    });
  } else {
    prompt("لینک رو کپی کن:", url);
  }
}

// FILTERS
document.getElementById("filtersType").addEventListener("click", function(e) {
  var f = e.target.closest(".filter");
  if (!f) return;
  var all = document.querySelectorAll("#filtersType .filter");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
  f.classList.add("active");
  filterType = f.getAttribute("data-filter-type");
  renderAll();
});

document.getElementById("filtersProperty").addEventListener("click", function(e) {
  var f = e.target.closest(".filter");
  if (!f) return;
  var all = document.querySelectorAll("#filtersProperty .filter");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
  f.classList.add("active");
  filterProperty = f.getAttribute("data-filter-prop");
  renderAll();
});

document.getElementById("searchInput").addEventListener("input", function(e) {
  searchText = e.target.value.trim();
  renderAll();
});

var footerWa = document.getElementById("footerWa");
footerWa.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("سلام، از سایت املاک نعمتی تماس می‌گیرم.");

loadListings();
</script>
