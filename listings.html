<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املاک نعمتی | لیست املاک</title>
<meta name="description" content="مشاهده همه املاک موجود برای خرید و اجاره - املاک نعمتی">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e17;
    --card: #1a2433;
    --card2: #223046;
    --border: #2d3e5a;
    --text: #e6edf5;
    --muted: #8fa3bf;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #22c55e;
    --sell: #4ade80;
    --rent: #f472b6;
    --whatsapp: #25D366;
    --warn: #f59e0b;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
    overflow-x: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1e3a5f 0%, #0a0e17 100%);
    padding: 24px 16px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(59,130,246,0.35) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .logo {
    width: 58px; height: 58px;
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 6px 24px rgba(59,130,246,0.45);
    flex-shrink: 0;
  }
  .brand-info { flex: 1; }
  .brand-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .brand-tag {
    font-size: 13px;
    color: var(--muted);
  }
  .stats-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: #60a5fa;
    font-size: 13px;
    font-weight: bold;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
  }

  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .search-wrap input {
    width: 100%;
    padding: 15px 48px 15px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .search-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
  }
  .search-wrap .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 20px;
    pointer-events: none;
  }

  .filters-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .filter-row {
    margin-bottom: 12px;
  }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: bold;
  }
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter {
    padding: 8px 16px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 13px;
    color: var(--muted);
    transition: all 0.2s;
    font-family: inherit;
    font-weight: 600;
  }
  .filter:hover {
    border-color: var(--primary);
    color: var(--text);
  }
  .filter.active {
    background: linear-gradient(135deg, var(--primary), #60a5fa);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(59,130,246,0.3);
  }

  .results-count {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .results-count b { color: var(--text); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    animation: fadeUp 0.4s ease;
  }
  .card:hover {
    border-color: var(--primary);
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(59,130,246,0.25);
  }

  .card-media {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: var(--card2);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s;
  }
  .card:hover .card-media img {
    transform: scale(1.05);
  }
  .card-media .placeholder {
    font-size: 64px;
    color: var(--border);
    opacity: 0.6;
  }
  .card-media .type-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    color: #fff;
  }
  .card-media .type-badge.sell { color: var(--sell); }
  .card-media .type-badge.rent { color: var(--rent); }

  .card-media .new-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: bold;
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #000;
    box-shadow: 0 4px 12px rgba(245,158,11,0.4);
  }

  .card-body {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .card-price {
    font-size: 17px;
    font-weight: bold;
    color: var(--success);
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .card-info {
    font-size: 13px;
    color: var(--muted);
    margin: 5px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-info b {
    color: var(--text);
    font-weight: normal;
  }
  .card-actions {
    margin-top: auto;
    padding-top: 12px;
    display: flex;
    gap: 8px;
  }
  .card-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .card-btn-details {
    background: var(--primary);
    color: #fff;
  }
  .card-btn-details:hover { background: var(--primary-hover); }
  .card-btn-wa {
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
  }
  .card-btn-wa:hover { filter: brightness(1.1); }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 16px;
  }
  .empty .icon { font-size: 70px; margin-bottom: 16px; opacity: 0.5; }
  .empty h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .empty p { font-size: 14px; }

  .loading {
    text-align: center;
    padding: 100px 20px;
    color: var(--muted);
  }
  .spinner {
    display: inline-block;
    width: 44px;
    height: 44px;
    border: 4px solid var(--card2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  .footer {
    text-align: center;
    padding: 30px 16px;
    margin-top: 30px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .footer-brand {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 8px;
    font-weight: bold;
  }
  .footer-info {
    margin: 4px 0;
  }
  .footer-wa {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(37,211,102,0.3);
  }
  .footer-wa:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 500px) {
    .container { padding: 12px; }
    .brand-name { font-size: 18px; }
    .logo { width: 50px; height: 50px; font-size: 26px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .card-media { aspect-ratio: 16 / 9; }
    .card-title { font-size: 16px; }
    .card-price { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand-row">
      <div class="logo">🏠</div>
      <div class="brand-info">
        <div class="brand-name">املاک نعمتی</div>
        <div class="brand-tag">خرید، فروش و اجاره ملک</div>
      </div>
    </div>
    <div class="stats-badge" id="totalBadge">
      <span>⏳</span>
      <span>در حال بارگذاری...</span>
    </div>
  </div>
</div>

<div class="container">

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="جستجو در موقعیت، نوع ملک، قیمت...">
    <span class="icon">🔍</span>
  </div>

  <div class="filters-section">
    <div class="filter-row">
      <div class="filter-label">🏠 نوع معامله</div>
      <div class="filters" id="filtersType">
        <button class="filter active" data-filter-type="all">📂 همه</button>
        <button class="filter" data-filter-type="sell">💰 فروش</button>
        <button class="filter" data-filter-type="rent">🏠 اجاره</button>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">🏘️ نوع ملک</div>
      <div class="filters" id="filtersProperty">
        <button class="filter active" data-filter-prop="all">📂 همه</button>
        <button class="filter" data-filter-prop="آپارتمان">🏢 آپارتمان</button>
        <button class="filter" data-filter-prop="ویلا">🏡 ویلا</button>
        <button class="filter" data-filter-prop="زمین">🌳 زمین</button>
        <button class="filter" data-filter-prop="تجاری">🏪 تجاری</button>
        <button class="filter" data-filter-prop="اداری">🏛️ اداری</button>
        <button class="filter" data-filter-prop="مغازه">🏬 مغازه</button>
      </div>
    </div>
  </div>

  <div class="results-count" id="resultsCount"></div>
  <div id="listingsGrid" class="grid"></div>

</div>

<div class="footer">
  <div class="footer-brand">🏠 املاک نعمتی</div>
  <div class="footer-info">📍 قم، خیابان کلهری</div>
  <div class="footer-info">📞 0912 452 7903</div>
  <a class="footer-wa" id="footerWa" href="#" target="_blank">
    <span>💬</span>
    <span>تماس در واتساپ</span>
  </a>
  <div style="margin-top:16px">© تمام حقوق محفوظ است</div>
</div>

<script>
const API_BASE = "https://estate-admin-api.jawadmontazer313.workers.dev";
const P_PAGE = "https://emlak-nemati.pages.dev/p.html";
const WHATSAPP_NUMBER = "989124527903";

let allListings = [];
let filterType = "all";
let filterProperty = "all";
let searchText = "";

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function isNew(dateIso) {
  if (!dateIso) return false;
  const days = (Date.now() - new Date(dateIso).getTime()) / (1000*60*60*24);
  return days <= 3;
}

async function loadListings() {
  const grid = document.getElementById("listingsGrid");
  grid.innerHTML = `
    <div class="loading" style="grid-column:1/-1">
      <div class="spinner"></div>
      <div>در حال بارگذاری املاک...</div>
    </div>
  `;

  try {
    const r = await fetch(API_BASE + "/api/public/listings");
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "خطا");
    allListings = data.listings || [];
    renderAll();
  } catch (e) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="icon">😔</div>
        <h2>خطا در بارگذاری</h2>
        <p>${escapeHtml(e.message)}</p>
      </div>
    `;
    document.getElementById("totalBadge").innerHTML = `<span>❌</span><span>خطا</span>`;
  }
}

function applyFilters() {
  let list = [...allListings];

  if (filterType === "sell" || filterType === "rent") {
    list = list.filter(l => l.type === filterType);
  }

  if (filterProperty !== "all") {
    list = list.filter(l => (l.propertyType || "").includes(filterProperty));
  }

  if (searchText) {
    const q = searchText.toLowerCase();
    list = list.filter(l =>
      (l.location || "").toLowerCase().includes(q) ||
      (l.propertyType || "").toLowerCase().includes(q) ||
      (l.extra_notes || "").toLowerCase().includes(q) ||
      (l.price || "").toLowerCase().includes(q)
    );
  }

  return list;
}

function renderAll() {
  const grid = document.getElementById("listingsGrid");
  const list = applyFilters();

  document.getElementById("totalBadge").innerHTML = `<span>🏘️</span><span>${allListings.length} ملک موجود</span>`;
  document.getElementById("resultsCount").innerHTML =
    list.length === allListings.length
      ? `نمایش <b>${list.length}</b> ملک`
      : `نمایش <b>${list.length}</b> از <b>${allListings.length}</b> ملک`;

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="icon">🔍</div>
        <h2>ملکی پیدا نشد</h2>
        <p>فیلترها یا جستجو رو تغییر بده</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = list.map(cardHtml).join("");
}

function cardHtml(l) {
  const typeLabel = l.type === "rent" ? "🏠 اجاره" : "💰 فروش";
  const typeClass = l.type === "rent" ? "rent" : "sell";
  const isN = isNew(l.date);

  let mediaHtml = "";
  if (l.mediaFileId && l.mediaType === "photo") {
    const url = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    mediaHtml = `<img src="${url}" alt="${escapeHtml(l.propertyType || 'ملک')}" loading="lazy">`;
  } else if (l.mediaFileId && l.mediaType === "video") {
    mediaHtml = `<div class="placeholder">🎬</div>`;
  } else {
    const icons = { "آپارتمان": "🏢", "ویلا": "🏡", "ویلایی": "🏡", "زمین": "🌳", "تجاری": "🏪", "اداری": "🏛️", "مغازه": "🏬" };
    const icon = icons[l.propertyType] || "🏘️";
    mediaHtml = `<div class="placeholder">${icon}</div>`;
  }

  const infoRows = [];
  if (l.location) infoRows.push({ icon: "📍", text: escapeHtml(l.location) });
  if (l.size) infoRows.push({ icon: "📐", text: escapeHtml(l.size) + (l.size.includes("متر") ? "" : " متر") });
  if (l.document) infoRows.push({ icon: "📄", text: "سند: " + escapeHtml(l.document) });

  const url = P_PAGE + "?id=" + encodeURIComponent(l.key);
  const waMessage = `سلام، درباره این ملک سوال داشتم:\n${l.propertyType || ""} - ${l.location || ""}\n${url}`;
  const waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(waMessage);

  return `
    <div class="card">
      <a class="card-media" href="${url}" target="_blank" rel="noopener">
        ${mediaHtml}
        <div class="type-badge ${typeClass}">${typeLabel}</div>
        ${isN ? `<div class="new-badge">✨ جدید</div>` : ""}
      </a>
      <div class="card-body">
        <div class="card-title">${escapeHtml(l.propertyType || "ملک")}</div>
        ${l.price ? `<div class="card-price">${escapeHtml(l.price)}</div>` : ""}
        ${infoRows.map(r => `<div class="card-info"><span>${r.icon}</span><span>${r.text}</span></div>`).join("")}
        <div class="card-actions">
          <a class="card-btn card-btn-details" href="${url}" target="_blank" rel="noopener">👁️ جزئیات</a>
          <a class="card-btn card-btn-wa" href="${waUrl}" target="_blank" rel="noopener">💬 واتساپ</a>
        </div>
      </div>
    </div>
  `;
}

document.getElementById("filtersType").addEventListener("click", e => {
  const f = e.target.closest(".filter");
  if (!f) return;
  document.querySelectorAll("#filtersType .filter").forEach(x => x.classList.remove("active"));
  f.classList.add("active");
  filterType = f.dataset.filterType;
  renderAll();
});

document.getElementById("filtersProperty").addEventListener("click", e => {
  const f = e.target.closest(".filter");
  if (!f) return;
  document.querySelectorAll("#filtersProperty .filter").forEach(x => x.classList.remove("active"));
  f.classList.add("active");
  filterProperty = f.dataset.filterProp;
  renderAll();
});

document.getElementById("searchInput").addEventListener("input", e => {
  searchText = e.target.value.trim();
  renderAll();
});

const footerWa = document.getElementById("footerWa");
footerWa.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("سلام، از سایت املاک نعمتی تماس می‌گیرم.");

loadListings();
</script>
</body>
</html>
