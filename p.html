<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاهده ملک | املاک نعمتی</title>
<meta name="description" content="مشاهده جزئیات ملک - املاک نعمتی">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e17;
    --bg2: #0f1720;
    --card: #1a2433;
    --card2: #223046;
    --border: #2d3e5a;
    --text: #e6edf5;
    --muted: #8fa3bf;
    --primary: #3b82f6;
    --success: #22c55e;
    --whatsapp: #25D366;
    --warn: #f59e0b;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1e3a5f 0%, #0a0e17 100%);
    padding: 20px 16px 24px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-inner {
    max-width: 700px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 20px rgba(59,130,246,0.4);
    flex-shrink: 0;
  }
  .brand-info { flex: 1; }
  .brand-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .brand-tag {
    font-size: 12px;
    color: var(--muted);
  }

  /* CONTAINER */
  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 140px;
  }

  /* MEDIA */
  .media-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 16px;
    animation: fadeUp 0.5s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .media-box img, .media-box video {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    display: block;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;
    animation: fadeUp 0.6s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  .badges {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
  }
  .badge.sell { background: linear-gradient(135deg, #14532d, #16a34a); color: #fff; }
  .badge.rent { background: linear-gradient(135deg, #4a1d3f, #be185d); color: #fff; }
  .badge.new { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #000; }

  .title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .price-block {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.05));
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 14px;
    margin-bottom: 20px;
  }
  .price-icon { font-size: 26px; }
  .price-text {
    font-size: 24px;
    font-weight: bold;
    color: var(--success);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .info-item {
    background: var(--card2);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .info-icon { font-size: 22px; flex-shrink: 0; }
  .info-body { flex: 1; min-width: 0; }
  .info-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .info-value {
    font-size: 14px;
    font-weight: bold;
    word-break: break-word;
  }

  /* NOTES */
  .notes-card {
    background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(59,130,246,0.02));
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    animation: fadeUp 0.7s ease;
  }
  .notes-title {
    font-size: 14px;
    color: #60a5fa;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .notes-text {
    font-size: 15px;
    white-space: pre-wrap;
    line-height: 1.9;
    color: var(--text);
  }

  /* SHARE BUTTON */
  .share-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.2s;
    font-weight: 600;
  }
  .share-btn:hover {
    background: var(--border);
    transform: translateY(-2px);
  }
  .share-btn:active { transform: translateY(0); }

  /* FIXED BOTTOM */
  .fixed-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    z-index: 100;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
  }
  .btn-group {
    display: flex;
    gap: 10px;
    max-width: 700px;
    margin: 0 auto;
  }
  .call-btn, .whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.2s;
    flex: 1;
    color: #fff;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .call-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 4px 16px rgba(34,197,94,0.3);
  }
  .whatsapp-btn {
    background: linear-gradient(135deg, #25D366, #128C7E);
    box-shadow: 0 4px 16px rgba(37,211,102,0.3);
  }
  .call-btn:hover, .whatsapp-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
  }
  .call-btn:active, .whatsapp-btn:active {
    transform: translateY(0);
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 24px 16px;
    margin-top: 16px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }
  .footer-brand {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 6px;
    font-weight: bold;
  }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 100px 20px;
    color: var(--muted);
  }
  .spinner {
    display: inline-block;
    width: 44px;
    height: 44px;
    border: 4px solid var(--card2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  /* ERROR */
  .error-box {
    text-align: center;
    padding: 80px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    animation: fadeUp 0.4s ease;
  }
  .error-box .icon {
    font-size: 70px;
    margin-bottom: 16px;
    opacity: 0.6;
  }
  .error-box h2 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  .error-box p {
    color: var(--muted);
    font-size: 14px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card2);
    border: 1px solid var(--border);
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 500px) {
    .container { padding: 12px; padding-bottom: 140px; }
    .title { font-size: 22px; }
    .price-text { font-size: 20px; }
    .info-grid { gap: 8px; }
    .info-item { padding: 12px; }
    .info-value { font-size: 13px; }
    .call-btn, .whatsapp-btn { padding: 14px 12px; font-size: 14px; }
    .brand-name { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="logo">🏠</div>
    <div class="brand-info">
      <div class="brand-name">املاک نعمتی</div>
      <div class="brand-tag">خرید، فروش و اجاره ملک</div>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>در حال بارگذاری...</div>
    </div>
  </div>
</div>

<!-- FIXED BUTTONS -->
<div class="fixed-bottom" id="fixedBottom" style="display:none">
  <div class="btn-group">
    <a class="call-btn" id="callBtn" href="#">
      <span>📞</span>
      <span>تماس</span>
    </a>
    <a class="whatsapp-btn" id="waBtn" href="#" target="_blank">
      <span>💬</span>
      <span>واتساپ</span>
    </a>
  </div>
</div>

<!-- FOOTER -->
<div class="footer" id="footer" style="display:none">
  <div class="footer-brand">🏠 املاک نعمتی</div>
  <div>قم، خیابان کلهری</div>
  <div style="margin-top:8px">© تمام حقوق محفوظ است</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = "https://estate-admin-api.jawadmontazer313.workers.dev";

// شماره واتساپ املاک نعمتی
const WHATSAPP_NUMBER = "989124527903";

function getListingId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id") || "";
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function showError(msg) {
  document.getElementById("content").innerHTML = `
    <div class="error-box">
      <div class="icon">🏚️</div>
      <h2>ملک پیدا نشد</h2>
      <p>${escapeHtml(msg)}</p>
    </div>
  `;
}

async function loadListing() {
  const id = getListingId();
  if (!id) { showError("لینک نامعتبر است"); return; }

  try {
    const r = await fetch(API_BASE + "/api/public/listing/" + encodeURIComponent(id));
    const data = await r.json();

    if (!data.ok || !data.listing) {
      showError(data.error || "ملک پیدا نشد یا حذف شده");
      return;
    }

    renderListing(data.listing);
  } catch (e) {
    showError("خطا در ارتباط با سرور");
  }
}

function renderListing(l) {
  const typeLabel = l.type === "rent" ? "🏠 اجاره" : "💰 فروش";
  const typeClass = l.type === "rent" ? "rent" : "sell";

  let isNew = false;
  if (l.date) {
    const days = (Date.now() - new Date(l.date).getTime()) / (1000*60*60*24);
    if (days <= 7) isNew = true;
  }

  // MEDIA
  let mediaHtml = "";
  if (l.mediaFileId) {
    const mediaUrl = API_BASE + "/api/public/media?fileId=" + encodeURIComponent(l.mediaFileId);
    if (l.mediaType === "video") {
      mediaHtml = `<div class="media-box"><video src="${mediaUrl}" controls preload="metadata" playsinline></video></div>`;
    } else {
      mediaHtml = `<div class="media-box"><img src="${mediaUrl}" alt="${escapeHtml(l.propertyType || 'ملک')}" loading="lazy"></div>`;
    }
  }

  // INFO
  const infoItems = [];
  if (l.size) infoItems.push({ icon: "📐", label: "متراژ", value: l.size });
  if (l.document) infoItems.push({ icon: "📄", label: "سند", value: l.document });
  if (l.location) infoItems.push({ icon: "📍", label: "موقعیت", value: l.location });

  let infoHtml = "";
  if (infoItems.length) {
    infoHtml = `<div class="info-grid">${infoItems.map(i => `
      <div class="info-item">
        <div class="info-icon">${i.icon}</div>
        <div class="info-body">
          <div class="info-label">${i.label}</div>
          <div class="info-value">${escapeHtml(i.value)}</div>
        </div>
      </div>
    `).join("")}</div>`;
  }

  let html = `
    ${mediaHtml}

    <div class="card">
      <div class="badges">
        <span class="badge ${typeClass}">${typeLabel}</span>
        ${isNew ? `<span class="badge new">✨ جدید</span>` : ""}
      </div>

      <div class="title">${escapeHtml(l.propertyType || "ملک")}</div>

      ${l.price ? `
        <div class="price-block">
          <span class="price-icon">💰</span>
          <span class="price-text">${escapeHtml(l.price)}</span>
        </div>
      ` : ""}

      ${infoHtml}
    </div>
  `;

  if (l.extra_notes) {
    html += `
      <div class="notes-card">
        <div class="notes-title">📝 توضیحات ملک</div>
        <div class="notes-text">${escapeHtml(l.extra_notes)}</div>
      </div>
    `;
  }

  html += `
    <button class="share-btn" onclick="shareListing()">
      <span>📤</span>
      <span>اشتراک‌گذاری این ملک</span>
    </button>
  `;

  document.getElementById("content").innerHTML = html;

  // Setup buttons
  if (l.phone) {
    const cleanPhone = String(l.phone).replace(/[^\d+]/g, "");
    document.getElementById("callBtn").href = "tel:" + cleanPhone;
  } else {
    document.getElementById("callBtn").style.display = "none";
  }

  document.getElementById("fixedBottom").style.display = "block";
  document.getElementById("footer").style.display = "block";

  // WhatsApp button
  const waMessage = `سلام، درباره این ملک سوال داشتم:\n${l.propertyType || ""} - ${l.location || ""}\n${window.location.href}`;
  const waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(waMessage);
  document.getElementById("waBtn").href = waUrl;
}

async function shareListing() {
  const url = window.location.href;
  const title = "املاک نعمتی - مشاهده ملک";

  if (navigator.share) {
    try {
      await navigator.share({ title, text: "این ملک رو ببین:", url });
    } catch (e) {}
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(url);
      showToast("لینک کپی شد ✅");
    } catch (e) {
      prompt("لینک رو کپی کن:", url);
    }
  } else {
    prompt("لینک رو کپی کن:", url);
  }
}

loadListing();
</script>
</body>
</html>
